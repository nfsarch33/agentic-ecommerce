services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ec-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: ec-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ec-redisdata:/data
      - ./configs/redis-streams.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  temporal:
    image: temporalio/temporal:${TEMPORAL_IMAGE_TAG:-latest}
    container_name: ec-temporal
    profiles: ["temporal", "temporal-worker"]
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /tmp/temporal.db
      - --namespace
      - default
    ports:
      - "${BIND_HOST:-127.0.0.1}:${TEMPORAL_GRPC_HOST_PORT:-7233}:7233"
      - "${BIND_HOST:-127.0.0.1}:${TEMPORAL_UI_HOST_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  wc-db:
    image: ${WC_DB_IMAGE:-mariadb:11.4}
    container_name: ec-wc-db
    profiles: ["woocommerce"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WC_DB_NAME:-wordpress}
      MARIADB_USER: ${WC_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WC_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WC_DB_ROOT_PASSWORD:-wordpress-root}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WC_DB_HOST_PORT:-3307}:3306"
    volumes:
      - ec-wc-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: ${WC_WORDPRESS_IMAGE:-wordpress:php8.3-apache}
    container_name: ec-wordpress
    profiles: ["woocommerce"]
    restart: unless-stopped
    depends_on:
      wc-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wc-db:3306
      WORDPRESS_DB_NAME: ${WC_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WC_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WC_DB_PASSWORD:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WC_HOST_PORT:-8081}:80"
    volumes:
      - ec-wpdata:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if (!$$s) { exit(1); } fclose($$s);'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  wc-cli:
    image: ${WC_CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: ["tools"]
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wc-db:3306
      WORDPRESS_DB_NAME: ${WC_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WC_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WC_DB_PASSWORD:-wordpress}
    volumes:
      - ec-wpdata:/var/www/html
    user: "33:33"
    entrypoint: ["wp"]
    command: ["--info"]
    security_opt:
      - no-new-privileges:true

  mc-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: mc-api
    container_name: ec-mc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_HTTP_ADDR: "0.0.0.0:8080"
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_READINESS_TIMEOUT: ${ECOMMERCE_READINESS_TIMEOUT:-2s}
      ECOMMERCE_SHUTDOWN_TIMEOUT: ${ECOMMERCE_SHUTDOWN_TIMEOUT:-10s}
      ECOMMERCE_OTEL_ENABLED: ${ECOMMERCE_OTEL_ENABLED:-false}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_EVENTBUS_CONSUMER_GROUP: ${ECOMMERCE_EVENTBUS_CONSUMER_GROUP:-ec-api-group}
      ECOMMERCE_EVENTBUS_STREAMS: ${ECOMMERCE_EVENTBUS_STREAMS:-ec.product.events,ec.order.events,ec.sync.events,ec.agent.events,ec.compliance.events}
      ECOMMERCE_JWT_SECRET: ${ECOMMERCE_JWT_SECRET:-}
      ECOMMERCE_JWT_ISSUER: ${ECOMMERCE_JWT_ISSUER:-agentic-ecommerce}
      ECOMMERCE_JWT_AUDIENCE: ${ECOMMERCE_JWT_AUDIENCE:-mc-api}
      ECOMMERCE_JWT_ACCESS_TTL: ${ECOMMERCE_JWT_ACCESS_TTL:-15m}
      ECOMMERCE_REFRESH_TTL: ${ECOMMERCE_REFRESH_TTL:-24h}
      ECOMMERCE_ADMIN_USERNAME: ${ECOMMERCE_ADMIN_USERNAME:-}
      ECOMMERCE_ADMIN_PASSWORD: ${ECOMMERCE_ADMIN_PASSWORD:-}
      ECOMMERCE_ADMIN_ROLE: ${ECOMMERCE_ADMIN_ROLE:-admin}
      ECOMMERCE_RATE_LIMIT_CAPACITY: ${ECOMMERCE_RATE_LIMIT_CAPACITY:-60}
      ECOMMERCE_RATE_LIMIT_REFILL: ${ECOMMERCE_RATE_LIMIT_REFILL:-1m}
      ECOMMERCE_API_TOKEN: ${ECOMMERCE_API_TOKEN:-}
      ECOMMERCE_ALLOWED_ORIGIN: ${ECOMMERCE_ALLOWED_ORIGIN:-}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE: ${ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE:-70}
      ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES: ${ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES:-5242880}
      ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES: ${ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MC_API_HOST_PORT:-8080}:8080"
    volumes:
      - .:/src:ro
      - ${ECOMMERCE_MEDIA_HOST_DIR:-./.local/media-uploads}:/var/lib/agentic-ecommerce/media
    security_opt:
      - no-new-privileges:true

  wc-sync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: wc-sync
    container_name: ec-wc-sync
    profiles: ["sync"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_WC_BASE_URL: ${ECOMMERCE_WC_BASE_URL:-http://wordpress}
      ECOMMERCE_WC_CONSUMER_KEY: ${ECOMMERCE_WC_CONSUMER_KEY:-}
      ECOMMERCE_WC_CONSUMER_SECRET: ${ECOMMERCE_WC_CONSUMER_SECRET:-}
      ECOMMERCE_SYNC_MODE: ${ECOMMERCE_SYNC_MODE:-once}
      ECOMMERCE_SYNC_DRY_RUN: ${ECOMMERCE_SYNC_DRY_RUN:-auto}
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
    security_opt:
      - no-new-privileges:true

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: agent-worker
    container_name: ec-agent-worker
    profiles: ["workers"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_AGENT_WORKER_ENABLED: ${ECOMMERCE_AGENT_WORKER_ENABLED:-true}
      ECOMMERCE_AGENT_WORKER_RUN_ONCE: ${ECOMMERCE_AGENT_WORKER_RUN_ONCE:-false}
      ECOMMERCE_AGENT_WORKER_CONCURRENCY: ${ECOMMERCE_AGENT_WORKER_CONCURRENCY:-1}
      ECOMMERCE_AGENT_WORKER_INTERVAL: ${ECOMMERCE_AGENT_WORKER_INTERVAL:-5m}
      ECOMMERCE_AGENT_WORKER_METRICS_ADDR: "0.0.0.0:8081"
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE: ${ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE:-70}
      ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES: ${ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES:-5242880}
      ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES: ${ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${AGENT_WORKER_METRICS_HOST_PORT:-8082}:8081"
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  temporal-worker:
    image: ${TEMPORAL_WORKER_IMAGE:-ghcr.io/nfsarch33/agentic-ecommerce:dev-temporal-worker}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: temporal-worker
    container_name: ec-temporal-worker
    profiles: ["temporal-worker"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_TEMPORAL_ADDR: ${ECOMMERCE_TEMPORAL_ADDR:-temporal:7233}
      ECOMMERCE_TEMPORAL_NAMESPACE: ${ECOMMERCE_TEMPORAL_NAMESPACE:-default}
      ECOMMERCE_TEMPORAL_TASK_QUEUE: ${ECOMMERCE_TEMPORAL_TASK_QUEUE:-ec-workflows}
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
    security_opt:
      - no-new-privileges:true

volumes:
  ec-pgdata:
  ec-redisdata:
  ec-temporaldata:
  ec-wc-dbdata:
  ec-wpdata:
