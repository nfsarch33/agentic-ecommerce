# Custom Gitleaks ruleset (extends Gitleaks defaults).
# Run: gitleaks detect --config .gitleaks.toml --source .
# History scan: gitleaks detect --config .gitleaks.toml --source . --log-opts="--all"
# Working tree only: gitleaks dir . --config .gitleaks.toml
#
# Custom rules:
#   - zdai-bearer     : gateway bearer token (zdai_ prefix)
#   - glrt-runner     : GitLab CE runner auth token
#   - aws-access-key  : AKIA / ASIA prefix
#   - ops-ey-jwt      : 1Password service-account JWT
#   - gh-pat          : github_pat_*/gh[pour]_*_... variants
#   - openai-anthropic: sk- prefixed keys (OpenAI/Anthropic/MiniMax)
#
# All rules are allowlistable via .gitleaksignore using the *fingerprint*,
# never the rule ID. History-scan fingerprints are commit:path:rule:line;
# working-tree (dir / --no-git) fingerprints are path:rule:line. Never
# blanket-suppress whole files: a path allowlist would also hide a real key
# pasted into that file later.

[extend]
useDefault = true

[[rules]]
id = "zdai-bearer"
description = "Gateway bearer token (zdai_ prefix)"
regex = '''zdai_[A-Za-z0-9_-]{40,80}'''
tags = ["secret", "gateway"]

[[rules]]
id = "glrt-runner"
description = "GitLab CE runner auth token"
regex = '''glrt-[A-Za-z0-9_-]{16,}'''
tags = ["secret", "gitlab-runner"]

[[rules]]
id = "aws-access-key"
description = "AWS access key ID (AKIA/ASIA)"
regex = '''(A|K|AS)IA[0-9A-Z]{16}'''
tags = ["secret", "aws"]

[[rules]]
id = "ops-ey-jwt"
description = "1Password service-account JWT"
regex = '''ops_eyJ[A-Za-z0-9_-]{20,}'''
tags = ["secret", "1password"]

[[rules]]
id = "gh-pat"
description = "GitHub PAT (classic or fine-grained)"
regex = '''gh[pousr]_[A-Za-z0-9]{30,}'''
tags = ["secret", "github"]

[[rules]]
id = "openai-anthropic"
description = "OpenAI / Anthropic / MiniMax-style API key"
regex = '''sk-(live-|test-)?[A-Za-z0-9]{20,}'''
tags = ["secret", "llm"]

# generic-api-key fires on two Go field REFERENCES (the secret side of the
# match is the field name, not a value); the regex allowlist targets that
# secret text. Synthetic fixture values are listed per line in .gitleaksignore.
[allowlist]
description = "Go field references the generic-api-key rule mistakes for values."
regexes = [
  '''APIKeyV3''',
  '''TikTokAPIP95Ms''',
]
