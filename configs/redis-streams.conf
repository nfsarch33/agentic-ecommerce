# Redis configuration optimised for Streams event bus workload.
# Mounted read-only into the redis container via docker compose.

# Persistence: AOF ensures stream entries survive restarts.
appendonly yes
appendfsync everysec

# Memory policy: noeviction prevents silent stream data loss.
# Size the container memory limit above this to leave headroom for
# connection buffers and Lua scripts.
maxmemory 256mb
maxmemory-policy noeviction

# Stream-specific tuning: keep radix tree nodes compact.
stream-node-max-bytes 4096
stream-node-max-entries 100

# Slow-log for debugging consumer lag.
slowlog-log-slower-than 10000
slowlog-max-len 128

# Connection limits (adjust per deployment size).
maxclients 512
tcp-keepalive 300
timeout 0
