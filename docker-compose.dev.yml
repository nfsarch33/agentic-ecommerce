services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ec-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: ec-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ec-redisdata:/data
      - ./configs/redis-streams.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    container_name: ec-minio
    profiles: ["media-objectstore"]
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - ec-miniodata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  temporal:
    image: temporalio/temporal:${TEMPORAL_IMAGE_TAG:-latest}
    container_name: ec-temporal
    profiles: ["temporal", "temporal-worker"]
    restart: unless-stopped
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /tmp/temporal.db
      - --namespace
      - default
    ports:
      - "${BIND_HOST:-127.0.0.1}:${TEMPORAL_GRPC_HOST_PORT:-7233}:7233"
      - "${BIND_HOST:-127.0.0.1}:${TEMPORAL_UI_HOST_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-1.88.0}
    container_name: ec-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://127.0.0.1:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: ${N8N_EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${N8N_EXECUTIONS_DATA_SAVE_ON_SUCCESS:-none}
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      SLACK_WEBHOOK_URL: ${N8N_SLACK_WEBHOOK_URL:-}
      ORDER_EMAIL_ENDPOINT_URL: ${N8N_ORDER_EMAIL_ENDPOINT_URL:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - ec-n8ndata:/home/node/.n8n
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:5678/healthz',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1)})\""
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  wc-db:
    image: ${WC_DB_IMAGE:-mariadb:11.4}
    container_name: ec-wc-db
    profiles: ["woocommerce"]
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WC_DB_NAME:-wordpress}
      MARIADB_USER: ${WC_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WC_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${WC_DB_ROOT_PASSWORD:-wordpress-root}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WC_DB_HOST_PORT:-3307}:3306"
    volumes:
      - ec-wc-dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u root -p\"$${MARIADB_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  wordpress:
    image: ${WC_WORDPRESS_IMAGE:-wordpress:php8.3-apache}
    container_name: ec-wordpress
    profiles: ["woocommerce"]
    restart: unless-stopped
    depends_on:
      wc-db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wc-db:3306
      WORDPRESS_DB_NAME: ${WC_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WC_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WC_DB_PASSWORD:-wordpress}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG', true);
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WC_HOST_PORT:-8081}:80"
    volumes:
      - ec-wpdata:/var/www/html
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$s=@fsockopen(\"127.0.0.1\",80); if (!$$s) { exit(1); } fclose($$s);'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  wc-cli:
    image: ${WC_CLI_IMAGE:-wordpress:cli-php8.3}
    profiles: ["tools"]
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: wc-db:3306
      WORDPRESS_DB_NAME: ${WC_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WC_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WC_DB_PASSWORD:-wordpress}
    volumes:
      - ec-wpdata:/var/www/html
    user: "33:33"
    entrypoint: ["wp"]
    command: ["--info"]
    security_opt:
      - no-new-privileges:true

  mc-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: mc-api
    container_name: ec-mc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_HTTP_ADDR: "0.0.0.0:8080"
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_DB_POOL_MAX_CONNS: ${ECOMMERCE_DB_POOL_MAX_CONNS:-10}
      ECOMMERCE_DB_POOL_MIN_CONNS: ${ECOMMERCE_DB_POOL_MIN_CONNS:-1}
      ECOMMERCE_DB_POOL_MAX_CONN_LIFETIME: ${ECOMMERCE_DB_POOL_MAX_CONN_LIFETIME:-30m}
      ECOMMERCE_DB_POOL_MAX_CONN_IDLE_TIME: ${ECOMMERCE_DB_POOL_MAX_CONN_IDLE_TIME:-5m}
      ECOMMERCE_DB_CONNECT_TIMEOUT: ${ECOMMERCE_DB_CONNECT_TIMEOUT:-5s}
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_READINESS_TIMEOUT: ${ECOMMERCE_READINESS_TIMEOUT:-2s}
      ECOMMERCE_REDIS_TIMEOUT: ${ECOMMERCE_REDIS_TIMEOUT:-500ms}
      ECOMMERCE_SHUTDOWN_TIMEOUT: ${ECOMMERCE_SHUTDOWN_TIMEOUT:-10s}
      ECOMMERCE_OTEL_ENABLED: ${ECOMMERCE_OTEL_ENABLED:-false}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_EVENTBUS_CONSUMER_GROUP: ${ECOMMERCE_EVENTBUS_CONSUMER_GROUP:-ec-api-group}
      ECOMMERCE_EVENTBUS_STREAMS: ${ECOMMERCE_EVENTBUS_STREAMS:-ec.product.events,ec.order.events,ec.sync.events,ec.agent.events,ec.compliance.events}
      ECOMMERCE_JWT_SECRET: ${ECOMMERCE_JWT_SECRET:-}
      ECOMMERCE_JWT_ISSUER: ${ECOMMERCE_JWT_ISSUER:-agentic-ecommerce}
      ECOMMERCE_JWT_AUDIENCE: ${ECOMMERCE_JWT_AUDIENCE:-mc-api}
      ECOMMERCE_JWT_ACCESS_TTL: ${ECOMMERCE_JWT_ACCESS_TTL:-15m}
      ECOMMERCE_REFRESH_TTL: ${ECOMMERCE_REFRESH_TTL:-24h}
      ECOMMERCE_ADMIN_USERNAME: ${ECOMMERCE_ADMIN_USERNAME:-}
      ECOMMERCE_ADMIN_PASSWORD: ${ECOMMERCE_ADMIN_PASSWORD:-}
      ECOMMERCE_ADMIN_ROLE: ${ECOMMERCE_ADMIN_ROLE:-admin}
      ECOMMERCE_RATE_LIMIT_CAPACITY: ${ECOMMERCE_RATE_LIMIT_CAPACITY:-60}
      ECOMMERCE_RATE_LIMIT_REFILL: ${ECOMMERCE_RATE_LIMIT_REFILL:-1m}
      ECOMMERCE_API_TOKEN: ${ECOMMERCE_API_TOKEN:-}
      ECOMMERCE_ALLOWED_ORIGIN: ${ECOMMERCE_ALLOWED_ORIGIN:-}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
      ECOMMERCE_MEDIA_STORAGE_DRIVER: ${ECOMMERCE_MEDIA_STORAGE_DRIVER:-filesystem}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_BASE_PATH: ${ECOMMERCE_MEDIA_BASE_PATH:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_BUCKET: ${ECOMMERCE_MEDIA_BUCKET:-}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_MEDIA_REGION: ${ECOMMERCE_MEDIA_REGION:-}
      ECOMMERCE_MEDIA_ENDPOINT: ${ECOMMERCE_MEDIA_ENDPOINT:-}
      ECOMMERCE_MEDIA_FORCE_PATH_STYLE: ${ECOMMERCE_MEDIA_FORCE_PATH_STYLE:-false}
      ECOMMERCE_MEDIA_ACCESS_KEY_ID: ${ECOMMERCE_MEDIA_ACCESS_KEY_ID:-}
      ECOMMERCE_MEDIA_SECRET_ACCESS_KEY: ${ECOMMERCE_MEDIA_SECRET_ACCESS_KEY:-}
      ECOMMERCE_MEDIA_MAX_SIZE_BYTES: ${ECOMMERCE_MEDIA_MAX_SIZE_BYTES:-5242880}
      ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES: ${ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE: ${ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE:-70}
      ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES: ${ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES:-5242880}
      ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES: ${ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MC_API_HOST_PORT:-8080}:8080"
    volumes:
      - .:/src:ro
      - ${ECOMMERCE_MEDIA_HOST_DIR:-./.local/media-uploads}:/var/lib/agentic-ecommerce/media
    security_opt:
      - no-new-privileges:true

  wc-sync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: wc-sync
    container_name: ec-wc-sync
    profiles: ["sync"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_WC_BASE_URL: ${ECOMMERCE_WC_BASE_URL:-http://wordpress}
      ECOMMERCE_WC_CONSUMER_KEY: ${ECOMMERCE_WC_CONSUMER_KEY:-}
      ECOMMERCE_WC_CONSUMER_SECRET: ${ECOMMERCE_WC_CONSUMER_SECRET:-}
      ECOMMERCE_SYNC_MODE: ${ECOMMERCE_SYNC_MODE:-once}
      ECOMMERCE_SYNC_DRY_RUN: ${ECOMMERCE_SYNC_DRY_RUN:-auto}
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
    security_opt:
      - no-new-privileges:true

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: agent-worker
    container_name: ec-agent-worker
    profiles: ["workers"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_AGENT_WORKER_ENABLED: ${ECOMMERCE_AGENT_WORKER_ENABLED:-true}
      ECOMMERCE_AGENT_WORKER_RUN_ONCE: ${ECOMMERCE_AGENT_WORKER_RUN_ONCE:-false}
      ECOMMERCE_AGENT_WORKER_CONCURRENCY: ${ECOMMERCE_AGENT_WORKER_CONCURRENCY:-1}
      ECOMMERCE_AGENT_WORKER_INTERVAL: ${ECOMMERCE_AGENT_WORKER_INTERVAL:-5m}
      ECOMMERCE_AGENT_SCHEDULES_ENABLED: ${ECOMMERCE_AGENT_SCHEDULES_ENABLED:-false}
      ECOMMERCE_AGENT_SCHEDULES_DEFAULT_INTERVAL: ${ECOMMERCE_AGENT_SCHEDULES_DEFAULT_INTERVAL:-15m}
      ECOMMERCE_AGENT_SCHEDULES_MAX_CONCURRENT_RUNS: ${ECOMMERCE_AGENT_SCHEDULES_MAX_CONCURRENT_RUNS:-1}
      ECOMMERCE_AGENT_SCHEDULES_TASK_QUEUE: ${ECOMMERCE_AGENT_SCHEDULES_TASK_QUEUE:-ec-workflows}
      ECOMMERCE_AGENT_WORKER_METRICS_ADDR: "0.0.0.0:8081"
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_DB_POOL_MAX_CONNS: ${ECOMMERCE_DB_POOL_MAX_CONNS:-10}
      ECOMMERCE_DB_POOL_MIN_CONNS: ${ECOMMERCE_DB_POOL_MIN_CONNS:-1}
      ECOMMERCE_DB_POOL_MAX_CONN_LIFETIME: ${ECOMMERCE_DB_POOL_MAX_CONN_LIFETIME:-30m}
      ECOMMERCE_DB_POOL_MAX_CONN_IDLE_TIME: ${ECOMMERCE_DB_POOL_MAX_CONN_IDLE_TIME:-5m}
      ECOMMERCE_DB_CONNECT_TIMEOUT: ${ECOMMERCE_DB_CONNECT_TIMEOUT:-5s}
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE: ${ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE:-70}
      ECOMMERCE_MEDIA_STORAGE_DRIVER: ${ECOMMERCE_MEDIA_STORAGE_DRIVER:-filesystem}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_BASE_PATH: ${ECOMMERCE_MEDIA_BASE_PATH:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_BUCKET: ${ECOMMERCE_MEDIA_BUCKET:-}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_MEDIA_REGION: ${ECOMMERCE_MEDIA_REGION:-}
      ECOMMERCE_MEDIA_ENDPOINT: ${ECOMMERCE_MEDIA_ENDPOINT:-}
      ECOMMERCE_MEDIA_FORCE_PATH_STYLE: ${ECOMMERCE_MEDIA_FORCE_PATH_STYLE:-false}
      ECOMMERCE_MEDIA_ACCESS_KEY_ID: ${ECOMMERCE_MEDIA_ACCESS_KEY_ID:-}
      ECOMMERCE_MEDIA_SECRET_ACCESS_KEY: ${ECOMMERCE_MEDIA_SECRET_ACCESS_KEY:-}
      ECOMMERCE_MEDIA_MAX_SIZE_BYTES: ${ECOMMERCE_MEDIA_MAX_SIZE_BYTES:-5242880}
      ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES: ${ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES: ${ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES:-5242880}
      ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES: ${ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${AGENT_WORKER_METRICS_HOST_PORT:-8082}:8081"
    volumes:
      - ${ECOMMERCE_MEDIA_HOST_DIR:-./.local/media-uploads}:/var/lib/agentic-ecommerce/media
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  temporal-worker:
    image: ${TEMPORAL_WORKER_IMAGE:-ghcr.io/nfsarch33/agentic-ecommerce:dev-temporal-worker}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        TARGET: temporal-worker
    container_name: ec-temporal-worker
    profiles: ["temporal-worker"]
    restart: unless-stopped
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_TEMPORAL_ADDR: ${ECOMMERCE_TEMPORAL_ADDR:-temporal:7233}
      ECOMMERCE_TEMPORAL_NAMESPACE: ${ECOMMERCE_TEMPORAL_NAMESPACE:-default}
      ECOMMERCE_TEMPORAL_TASK_QUEUE: ${ECOMMERCE_TEMPORAL_TASK_QUEUE:-ec-workflows}
      ECOMMERCE_AGENT_SCHEDULES_ENABLED: ${ECOMMERCE_AGENT_SCHEDULES_ENABLED:-false}
      ECOMMERCE_AGENT_SCHEDULES_DEFAULT_INTERVAL: ${ECOMMERCE_AGENT_SCHEDULES_DEFAULT_INTERVAL:-15m}
      ECOMMERCE_AGENT_SCHEDULES_MAX_CONCURRENT_RUNS: ${ECOMMERCE_AGENT_SCHEDULES_MAX_CONCURRENT_RUNS:-1}
      ECOMMERCE_AGENT_SCHEDULES_TASK_QUEUE: ${ECOMMERCE_AGENT_SCHEDULES_TASK_QUEUE:-ec-workflows}
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_DB_POOL_MAX_CONNS: ${ECOMMERCE_DB_POOL_MAX_CONNS:-10}
      ECOMMERCE_DB_POOL_MIN_CONNS: ${ECOMMERCE_DB_POOL_MIN_CONNS:-1}
      ECOMMERCE_DB_POOL_MAX_CONN_LIFETIME: ${ECOMMERCE_DB_POOL_MAX_CONN_LIFETIME:-30m}
      ECOMMERCE_DB_POOL_MAX_CONN_IDLE_TIME: ${ECOMMERCE_DB_POOL_MAX_CONN_IDLE_TIME:-5m}
      ECOMMERCE_DB_CONNECT_TIMEOUT: ${ECOMMERCE_DB_CONNECT_TIMEOUT:-5s}
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: "redis:6379"
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
      ECOMMERCE_MEDIA_STORAGE_DRIVER: ${ECOMMERCE_MEDIA_STORAGE_DRIVER:-filesystem}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_BASE_PATH: ${ECOMMERCE_MEDIA_BASE_PATH:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_BUCKET: ${ECOMMERCE_MEDIA_BUCKET:-}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_MEDIA_REGION: ${ECOMMERCE_MEDIA_REGION:-}
      ECOMMERCE_MEDIA_ENDPOINT: ${ECOMMERCE_MEDIA_ENDPOINT:-}
      ECOMMERCE_MEDIA_FORCE_PATH_STYLE: ${ECOMMERCE_MEDIA_FORCE_PATH_STYLE:-false}
      ECOMMERCE_MEDIA_ACCESS_KEY_ID: ${ECOMMERCE_MEDIA_ACCESS_KEY_ID:-}
      ECOMMERCE_MEDIA_SECRET_ACCESS_KEY: ${ECOMMERCE_MEDIA_SECRET_ACCESS_KEY:-}
      ECOMMERCE_MEDIA_MAX_SIZE_BYTES: ${ECOMMERCE_MEDIA_MAX_SIZE_BYTES:-5242880}
      ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES: ${ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    volumes:
      - ${ECOMMERCE_MEDIA_HOST_DIR:-./.local/media-uploads}:/var/lib/agentic-ecommerce/media
    security_opt:
      - no-new-privileges:true

  # uiauto-chrome: headless Chromium with the DevTools protocol exposed on
  # 9222. Mirrors uiauto-framework's docker-compose.integration.yml so the
  # ui-agent runner can attach via --remote-debug-url=http://uiauto-chrome:9222.
  # Profile-gated: this service only starts when `--profile uiauto` is engaged
  # (e.g. `make uiauto-smoke`). v2.1.0 research-mode integration; not required
  # by the default dev stack.
  uiauto-chrome:
    image: chromedp/headless-shell:stable
    container_name: ec-uiauto-chrome
    profiles: ["uiauto"]
    restart: "no"
    command:
      - --no-sandbox
      - --disable-gpu
      - --remote-allow-origins=*
    # Default host port is 9333 to avoid colliding with a developer's
    # locally-running Chrome on 9222 (mirrors uiauto-framework's
    # docker-compose.integration.yml convention). Container side stays on
    # the conventional 9222 so the runner uses the standard CDP URL.
    ports:
      - "${BIND_HOST:-127.0.0.1}:${UIAUTO_CDP_HOST_PORT:-9333}:9222"
    # chromedp/headless-shell ships without wget/curl, and CMD-SHELL runs
    # via /bin/sh (dash) which has no /dev/tcp. We invoke bash explicitly
    # so the healthcheck can use bash's built-in /dev/tcp probe to assert
    # the CDP socket is accepting connections.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9222"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # uiauto-omniparser-stub: lightweight wiremock stub matching the OmniParser
  # /probe and /parse contract. Real OmniParser V2 needs a GPU; the stub keeps
  # the comparison runs hermetic. Optional service: when omniparser is down,
  # ui-agent demo runs in OCR fallback mode (see uiauto-framework
  # docs/observability.md). v2.1.0 ports this stub from
  # uiauto-framework/docker-compose.integration.yml.
  uiauto-omniparser-stub:
    image: wiremock/wiremock:3.9.1
    container_name: ec-uiauto-omniparser-stub
    profiles: ["uiauto"]
    restart: "no"
    command: ["--port", "8080", "--global-response-templating"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${UIAUTO_OMNIPARSER_HOST_PORT:-8001}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/__admin/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  # uiauto-runner: builds ui-agent from the host uiauto-framework checkout and
  # runs scenarios against the chromedp service. Scenarios mount read-only so
  # a misbehaving runner cannot modify the canonical fixtures. Output volume
  # captures demo-results.json + screenshots for the comparison generator.
  #
  # UIAUTO_FRAMEWORK_PATH default targets the canonical checkout at
  # $HOME/Code/personal/uiauto-framework. The Makefile exports it for the
  # uiauto targets; ad-hoc compose users must set it explicitly.
  #
  # UIAUTO_SCENARIOS_PATH points at agentic-ecommerce-web/test/uiauto/scenarios
  # by default. UIAUTO_EXAMPLE_SCENARIOS_PATH points at this repo's bundled
  # smoke scenario so `make uiauto-smoke` works without the frontend repo.
  uiauto-runner:
    image: ec-uiauto-runner:dev
    container_name: ec-uiauto-runner
    profiles: ["uiauto"]
    restart: "no"
    # build.context is a named additional context (`harness`) keyed off
    # this repo's test/uiauto directory so docker compose can reach the
    # documented Dockerfile.runner override regardless of where the EC
    # repo lives on disk (canonical or worktree).
    #
    # The override exists because nfsarch33/uiauto-framework#8 makes the
    # stock Dockerfile fail on Go toolchain mismatch. Framework source
    # comes via the named context `framework`, NOT a vendor fork.
    # When the upstream issue is fixed, replace the build block with the
    # original `context: ${UIAUTO_FRAMEWORK_PATH}` shape and delete
    # test/uiauto/Dockerfile.runner.
    build:
      context: ${UIAUTO_HARNESS_PATH:-./test/uiauto}
      dockerfile: Dockerfile.runner
      additional_contexts:
        framework: ${UIAUTO_FRAMEWORK_PATH:-../uiauto-framework}
    depends_on:
      uiauto-chrome:
        condition: service_healthy
    environment:
      REMOTE_DEBUG_URL: ${UIAUTO_REMOTE_DEBUG_URL:-http://uiauto-chrome:9222}
      OMNIPARSER_URL: ${UIAUTO_OMNIPARSER_URL:-http://uiauto-omniparser-stub:8080}
      UIAUTO_OUTPUT_DIR: /work/output
    volumes:
      - ${UIAUTO_SCENARIOS_PATH:-../agentic-ecommerce-web/test/uiauto/scenarios}:/work/scenarios:ro
      - ${UIAUTO_EXAMPLE_SCENARIOS_PATH:-./test/uiauto/example}:/work/example-scenarios:ro
      - ec-uiauto-output:/work/output
    entrypoint: ["/ui-agent"]
    command: ["status"]
    security_opt:
      - no-new-privileges:true

volumes:
  ec-pgdata:
  ec-redisdata:
  ec-temporaldata:
  ec-miniodata:
  ec-n8ndata:
  ec-wc-dbdata:
  ec-wpdata:
  ec-uiauto-output:
