        required: true
        schema: { type: string }
    post:
      summary: Reject a pending submission with review notes
      operationId: rejectMarketplaceSubmission
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarketplaceSubmissionReviewAction' }
      responses:
        '200':
          description: Submission transitioned to rejected.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MarketplaceSubmission' }
        '422':
          description: Submission is in a terminal state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/v1/tenants:
    get:
      summary: List tenants (super-admin)
      operationId: listTenants
      security: [{ bearerAuth: [] }]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Page of tenants.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantsListResponse' }
    post:
      summary: Provision a tenant
      operationId: createTenant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTenantRequest' }
      responses:
        '201':
          description: Tenant created in status=provisioning.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
        '400':
          description: Invalid slug or name.
        '409':
          description: Slug already exists.
        '422':
          description: Quota exceeded.
  /api/v1/tenants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    get:
      summary: Read a tenant
      operationId: getTenant
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tenant aggregate.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
        '404':
          description: Tenant not found.
    patch:
      summary: Update name or plan
      operationId: updateTenant
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTenantRequest' }
      responses:
        '200':
          description: Tenant updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
        '404':
          description: Tenant not found.
  /api/v1/tenants/{id}/suspend:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Suspend an active tenant
      operationId: suspendTenant
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tenant transitioned to status=suspended.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
        '422':
          description: Invalid status transition.
  /api/v1/tenants/{id}/activate:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Activate a tenant (provisioning|suspended -> active)
      operationId: activateTenant
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tenant transitioned to status=active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
        '422':
          description: Invalid status transition.
  /api/v1/tenants/{id}/archive:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
    post:
      summary: Archive a tenant (terminal)
      operationId: archiveTenant
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tenant transitioned to status=archived.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResponse' }
        '422':
          description: Invalid status transition.

  # v2.5.0 Tenant self-service registration (public, rate-limited).
  /register:
    post:
      summary: Submit tenant registration
      operationId: submitRegistration
      description: |
        Public endpoint that creates a RegistrationRequest in
        status=pending_email_verification and emails an HMAC-signed
        verification token. No bearer auth; rate-limited via the
        same token bucket as the rest of the API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationSubmitRequest' }
      responses:
        '202':
          description: Registration accepted; verification email sent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationSubmitResponse' }
        '400':
          description: Invalid email or slug.
        '409':
          description: Slug already taken.
  /register/verify:
    post:
      summary: Consume verification token
      operationId: verifyRegistration
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationVerifyRequest' }
      responses:
        '200':
          description: Registration verified; ready for onboarding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationResponse' }
        '401':
          description: Token invalid or expired.
        '404':
          description: Registration not found.
  /register/onboarding:
    post:
      summary: Complete onboarding and provision tenant
      operationId: completeRegistrationOnboarding
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistrationOnboardingRequest' }
      responses:
        '200':
          description: Tenant provisioned and registration marked active.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistrationOnboardingResponse' }
        '409':
          description: Slug taken or already active.
        '422':
          description: Registration not yet verified.

