name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run gitleaks secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --no-git --redact --verbose

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run race tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Build binaries
        run: make build

  compose:
    name: Compose and Docker build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate full stack compose
        run: docker compose --env-file .env.compose.example -f docker-compose.yml config --quiet

      - name: Build mc-api image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            TARGET=mc-api
            COMMIT=${{ github.sha }}
          tags: agentic-ecommerce:${{ github.sha }}
          cache-from: type=gha,scope=ci-mc-api
          cache-to: type=gha,mode=max,scope=ci-mc-api

      - name: Build wc-sync image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            TARGET=wc-sync
            COMMIT=${{ github.sha }}
          tags: agentic-ecommerce:${{ github.sha }}-wc-sync
          cache-from: type=gha,scope=ci-wc-sync
          cache-to: type=gha,mode=max,scope=ci-wc-sync

      - name: Build content-worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            TARGET=content-worker
            COMMIT=${{ github.sha }}
          tags: agentic-ecommerce:${{ github.sha }}-content-worker
          cache-from: type=gha,scope=ci-content-worker
          cache-to: type=gha,mode=max,scope=ci-content-worker

      - name: Build agent-worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            TARGET=agent-worker
            COMMIT=${{ github.sha }}
          tags: agentic-ecommerce:${{ github.sha }}-agent-worker
          cache-from: type=gha,scope=ci-agent-worker
          cache-to: type=gha,mode=max,scope=ci-agent-worker

      - name: Build temporal-worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          build-args: |
            TARGET=temporal-worker
            COMMIT=${{ github.sha }}
          tags: agentic-ecommerce:${{ github.sha }}-temporal-worker
          cache-from: type=gha,scope=ci-temporal-worker
          cache-to: type=gha,mode=max,scope=ci-temporal-worker

      - name: Verify image sizes under 30MB
        run: |
          echo "Docker image size audit (target: <30MB each)"
          for tag in \
            "agentic-ecommerce:${{ github.sha }}" \
            "agentic-ecommerce:${{ github.sha }}-wc-sync" \
            "agentic-ecommerce:${{ github.sha }}-content-worker" \
            "agentic-ecommerce:${{ github.sha }}-agent-worker" \
            "agentic-ecommerce:${{ github.sha }}-temporal-worker"; do
            size=$(docker images "$tag" --format '{{.Size}}')
            echo "  $tag: $size"
          done

      - name: Scan mc-api image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan wc-sync image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}-wc-sync
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan content-worker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}-content-worker
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan agent-worker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}-agent-worker
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan temporal-worker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}-temporal-worker
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
