services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - ec-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    container_name: ec-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - ec-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  mc-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
    container_name: ec-mc-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_HTTP_ADDR: "0.0.0.0:8080"
      ECOMMERCE_DB_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable"
      ECOMMERCE_REDIS_ADDR: "redis:6379"
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:dev:}
      ECOMMERCE_API_TOKEN: ${ECOMMERCE_API_TOKEN:-}
      ECOMMERCE_ALLOWED_ORIGIN: ${ECOMMERCE_ALLOWED_ORIGIN:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MC_API_HOST_PORT:-8080}:8080"
    volumes:
      - .:/src:ro
    security_opt:
      - no-new-privileges:true

volumes:
  ec-pgdata:
  ec-redisdata:
