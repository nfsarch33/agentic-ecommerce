openapi: 3.1.0
info:
  title: Agentic Ecommerce Mission Control API
  version: 1.0.0
  description: |
    Public contract for the Agentic Ecommerce Go backend consumed by
    agentic-ecommerce-web. This spec intentionally excludes private
    operator endpoints and credential-bearing surfaces. Protected endpoints
    use short-lived HMAC-signed JWT bearer tokens and RBAC roles:
    admin, operator, and viewer.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      responses:
        '200':
          description: Service readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is live but not ready because a configured dependency check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus text exposition for build metadata, HTTP RED metrics, sync, agent, compliance, and media placeholders.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Only GET is supported.
  /api/v1/auth/login:
    post:
      summary: Bootstrap admin login
      operationId: login
      description: |
        Development/admin bootstrap login. Credentials must be supplied via
        runtime configuration; the API contract intentionally uses placeholders
        and does not define real secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT access token and refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: JWT auth or admin credentials are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      summary: Refresh JWT access token
      operationId: refreshAccessToken
      description: Rotates a configured refresh session and returns a new access token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New JWT access token and refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: JWT auth is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Get current authenticated session
      operationId: getCurrentSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session derived from the JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      summary: Validate logout request
      operationId: logout
      description: Stateless JWT logout endpoint for BFF compatibility. Clients clear their own httpOnly session cookie.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Bearer token accepted; client may clear its session cookie.
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products:
    get:
      summary: List storefront products
      operationId: listProducts
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated product list
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Present when the request origin matches ECOMMERCE_ALLOWED_ORIGIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          description: Missing or invalid JWT bearer token when auth is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin rejected by CORS policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate product (SKU or slug collision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (missing SKU, invalid price, etc).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: Products CORS preflight
      operationId: productsPreflight
      responses:
        '204':
          description: Preflight accepted.
        '403':
          description: Origin rejected by CORS policy.
  /api/v1/products/{id}:
    get:
      summary: Get a product by ID or slug
      operationId: getProduct
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product UUID or slug.
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid JSON body or invalid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted.
        '400':
          description: Invalid product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/generate-description:
    post:
      summary: Generate AI product content suggestions
      operationId: generateProductDescription
      description: Uses the configured fleet AI bridge. The backend never calls MiniMax directly.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDescriptionRequest'
      responses:
        '200':
          description: Generated content suggestion and quality evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSuggestion'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fleet bridge generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Content agent is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/ai-suggestions:
    get:
      summary: Get AI content suggestions for a product
      operationId: getProductAISuggestions
      description: Generates non-persisted product description, SEO title, and meta description suggestions.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generated content suggestion and quality evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSuggestion'
        '400':
          description: Invalid product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fleet bridge generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Content agent is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/compliance-check:
    post:
      summary: Run product content compliance checks
      operationId: checkProductCompliance
      description: Runs deterministic compliance rules before product publish. This endpoint does not call live AI services.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCheckRequest'
      responses:
        '200':
          description: Compliance check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckResponse'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/seo-suggestions:
    post:
      summary: Generate deterministic SEO suggestions
      operationId: suggestProductSEO
      description: Generates SEO title, meta description, slug, keyword density, and score without live AI calls.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SEOSuggestionRequest'
      responses:
        '200':
          description: SEO suggestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOSuggestionResponse'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/compliance/rules:
    get:
      summary: List built-in compliance rules
      operationId: listComplianceRules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Built-in compliance rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceRulesResponse'
  /api/v1/orders:
    post:
      summary: Create an order
      operationId: createOrder
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Order validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}:
    get:
      summary: Get an order by ID
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}/status:
    patch:
      summary: Advance order status
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid JSON body or invalid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid status or status transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/{session_id}:
    get:
      summary: Get a cart session
      operationId: getCart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Cart session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    put:
      summary: Replace a cart session
      operationId: putCart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: Cart saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid JSON body or session ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cart validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sync/status:
    get:
      summary: Get WooCommerce sync status
      operationId: getSyncStatus
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current sync status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStatus'
  /api/v1/sync/conflicts:
    get:
      summary: List pending WooCommerce sync conflicts
      operationId: listSyncConflicts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending conflicts queued for manual review
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictListResponse'
  /api/v1/sync/conflicts/{id}/resolve:
    post:
      summary: Resolve a WooCommerce sync conflict
      operationId: resolveSyncConflict
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolveConflictRequest'
      responses:
        '200':
          description: Conflict marked resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncConflict'
        '400':
          description: Invalid JSON body or conflict ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Conflict cannot be resolved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/sync/products/{id}/publish:
    post:
      summary: Publish a local product to WooCommerce
      operationId: publishProductToWooCommerce
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          description: Invalid product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: WooCommerce publish failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/webhooks/woocommerce/orders:
    post:
      summary: Receive WooCommerce order webhooks
      operationId: receiveWooCommerceOrderWebhook
      parameters:
        - name: X-WC-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-WC-Webhook-Topic
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooCommerceOrderWebhook'
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Invalid HMAC signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid WooCommerce order payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/webhooks/woocommerce/products:
    post:
      summary: Receive WooCommerce product webhooks
      operationId: receiveWooCommerceProductWebhook
      parameters:
        - name: X-WC-Webhook-Signature
          in: header
          required: true
          schema:
            type: string
        - name: X-WC-Webhook-Topic
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WooCommerceProductWebhook'
      responses:
        '200':
          description: Webhook accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '401':
          description: Invalid HMAC signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid WooCommerce product payload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/agents:
    get:
      summary: List registered backend agents
      operationId: listAgents
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Registered agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsListResponse'
  /api/v1/agents/{id}/run:
    post:
      summary: Queue a backend agent run
      operationId: runAgent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [sourcing, pricing, compliance]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRunRequest'
      responses:
        '202':
          description: Agent run queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/agents/{id}/history:
    get:
      summary: List historical runs for an agent
      operationId: listAgentHistory
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            enum: [sourcing, pricing, compliance]
      responses:
        '200':
          description: Agent run history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHistoryResponse'
        '404':
          description: Agent not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/agent-runs/{run_id}:
    get:
      summary: Get a backend agent run
      operationId: getAgentRun
      security:
        - bearerAuth: []
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Agent run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          description: Agent run not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/events/recent:
    get:
      summary: List recent backend events
      operationId: listRecentEvents
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Recent event activity, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentEventsResponse'
        '401':
          description: Missing or invalid JWT bearer token when auth is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HMAC-signed JWT access token issued by `/api/v1/auth/login` or `/api/v1/auth/refresh`.
  schemas:
    LoginRequest:
      type: object
      required: [password]
      description: Supply either username or email plus password.
      properties:
        username:
          type: string
          example: admin@example.invalid
        email:
          type: string
          format: email
          example: admin@example.invalid
        password:
          type: string
          format: password
          example: ${ECOMMERCE_ADMIN_PASSWORD}
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token returned by the login or refresh endpoint.
    AuthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, role, session]
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token.
        refresh_token:
          type: string
          description: Opaque refresh token. Store securely and never log.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
        role:
          type: string
          enum: [admin, operator, viewer]
        session:
          $ref: '#/components/schemas/AuthSession'
    AuthSession:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        expires_at:
          type: string
          format: date-time
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, operator, viewer]
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: agentic-ecommerce-mc-api
    ReadyResponse:
      type: object
      required: [status, service, agents, agent_worker, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: agentic-ecommerce-mc-api
        agents:
          type: integer
          minimum: 0
        agent_worker:
          $ref: '#/components/schemas/AgentWorkerReadiness'
        checks:
          type: object
          required: [database, redis]
          properties:
            database:
              $ref: '#/components/schemas/DependencyReadiness'
            redis:
              $ref: '#/components/schemas/DependencyReadiness'
    DependencyReadiness:
      type: object
      required: [status, optional, latency_ms]
      properties:
        status:
          type: string
          enum: [ok, fail, skipped]
        optional:
          type: boolean
          description: True when the dependency is not configured and therefore does not gate readiness.
        latency_ms:
          type: integer
          minimum: 0
        error:
          type: string
          description: Present only for failed checks. The value is intentionally generic to avoid leaking connection details.
    AgentWorkerReadiness:
      type: object
      required: [ready, scheduler, registered_agents]
      properties:
        ready:
          type: boolean
        scheduler:
          type: string
          enum: [in_process]
        registered_agents:
          type: integer
          minimum: 0
    AgentDescriptor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          enum: [sourcing, pricing, compliance]
        name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
    AgentsListResponse:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentDescriptor'
    AgentRunRequest:
      type: object
      properties:
        priority:
          type: integer
          default: 0
        payload:
          type: object
          additionalProperties: true
          description: Structured agent-specific input. Examples include sourcing candidates, pricing cost/competition data, or content compliance payloads.
    AgentRunError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
    AgentRun:
      type: object
      required: [id, task_id, agent_id, state, priority, created_at]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        agent_id:
          type: string
          enum: [sourcing, pricing, compliance]
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        priority:
          type: integer
        input:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/AgentRunError'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    AgentHistoryResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in the smallest currency unit (for example, cents).
        currency:
          type: string
          enum: [AUD, USD, GBP, EUR]
    Product:
      type: object
      required: [id, sku, title, slug, price, stock, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [draft, active, archived]
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required: [sku, title, price]
      properties:
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        slug:
          type: string
          description: Auto-generated from title if omitted.
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
          default: 0
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
    ProductListResponse:
      type: object
      required: [products, total, page, per_page]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
    GenerateDescriptionRequest:
      type: object
      properties:
        style:
          type: string
          enum: [professional, casual, luxury, technical]
          default: professional
        language:
          type: string
          default: en-AU
        max_words:
          type: integer
          minimum: 20
          maximum: 500
          default: 120
        keywords:
          type: array
          items:
            type: string
    ContentSuggestion:
      type: object
      required: [product_id, description, seo_title, meta_description, score, pass, tokens_used, evaluation]
      properties:
        product_id:
          type: string
          format: uuid
        description:
          type: string
        seo_title:
          type: string
          maxLength: 60
        meta_description:
          type: string
          maxLength: 160
        score:
          type: integer
          minimum: 0
          maximum: 100
        pass:
          type: boolean
        tokens_used:
          type: integer
          minimum: 0
        evaluation:
          $ref: '#/components/schemas/ContentEvaluation'
    ComplianceCheckRequest:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
        seo_title:
          type: string
          maxLength: 60
        meta_description:
          type: string
          maxLength: 155
        seo_score_min:
          type: integer
          minimum: 0
          maximum: 100
          default: 70
        legal_disclaimer:
          type: string
    ComplianceCheckResponse:
      type: object
      required: [product_id, pass, score, reasons, rule_ids, severity, results]
      properties:
        product_id:
          type: string
          format: uuid
        pass:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
        reasons:
          type: array
          items:
            type: string
        rule_ids:
          type: array
          items:
            type: string
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
        results:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceRuleResult'
    ComplianceRuleResult:
      type: object
      required: [id, pass, score, severity, reasons]
      properties:
        id:
          type: string
        pass:
          type: boolean
        score:
          type: integer
          minimum: 0
          maximum: 100
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
        reasons:
          type: array
          items:
            type: string
    ComplianceRuleDescriptor:
      type: object
      required: [id, description, severity]
      properties:
        id:
          type: string
        description:
          type: string
        severity:
          $ref: '#/components/schemas/ComplianceSeverity'
    ComplianceRulesResponse:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ComplianceRuleDescriptor'
    ComplianceSeverity:
      type: string
      enum: [info, warning, error, critical]
    SEOSuggestionRequest:
      type: object
      properties:
        keywords:
          type: array
          items:
            type: string
    SEOSuggestionResponse:
      type: object
      required: [product_id, title, meta_description, slug, score, keyword_density, pass, reasons]
      properties:
        product_id:
          type: string
          format: uuid
        title:
          type: string
          maxLength: 60
        meta_description:
          type: string
          maxLength: 155
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
        score:
          type: integer
          minimum: 0
          maximum: 100
        keyword_density:
          type: object
          additionalProperties:
            type: number
        pass:
          type: boolean
        reasons:
          type: array
          items:
            type: string
    ContentEvaluation:
      type: object
      required: [score, pass, readability_score, keyword_density, tone, length, factual_issues]
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        pass:
          type: boolean
        readability_score:
          type: number
        keyword_density:
          type: object
          additionalProperties:
            type: number
        tone:
          $ref: '#/components/schemas/ContentToneEvaluation'
        length:
          $ref: '#/components/schemas/ContentLengthEvaluation'
        factual_issues:
          type: array
          items:
            type: string
    ContentToneEvaluation:
      type: object
      required: [style, pass, issues]
      properties:
        style:
          type: string
          enum: [professional, casual, luxury, technical]
        pass:
          type: boolean
        issues:
          type: array
          items:
            type: string
    ContentLengthEvaluation:
      type: object
      required: [word_count, max_words, within_limit]
      properties:
        word_count:
          type: integer
          minimum: 0
        max_words:
          type: integer
          minimum: 0
        within_limit:
          type: boolean
    ShippingAddress:
      type: object
      required: [name, line1, city, postal_code, country]
      properties:
        name:
          type: string
          minLength: 1
        line1:
          type: string
          minLength: 1
        line2:
          type: string
        city:
          type: string
          minLength: 1
        region:
          type: string
        postal_code:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 2
    Totals:
      type: object
      required: [subtotal, shipping, total]
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    OrderItem:
      type: object
      required: [product_id, sku, title, quantity, unit_price, line_total]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
    OrderItemInput:
      type: object
      required: [product_id, sku, title, quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
    Order:
      type: object
      required: [id, customer_email, items, status, totals, shipping_address, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_email:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, paid, fulfilled, shipped, completed, failed, cancelled]
        totals:
          $ref: '#/components/schemas/Totals'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required: [customer_email, items, shipping_address]
      properties:
        customer_email:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
        shipping:
          $ref: '#/components/schemas/Money'
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paid, fulfilled, shipped, completed, failed, cancelled]
    Cart:
      type: object
      required: [session_id, items, totals, updated_at]
      properties:
        session_id:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totals:
          $ref: '#/components/schemas/Totals'
        updated_at:
          type: string
          format: date-time
    CartRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
    StatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
    RecentEventsResponse:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/EventItem'
    EventItem:
      type: object
      required: [id, type, severity, message, occurred_at]
      properties:
        id:
          type: string
          minLength: 1
        type:
          type: string
          enum: [product.created, product.updated, order.placed, sync.completed, agent.run.completed, compliance.checked]
        severity:
          type: string
          enum: [info, warning, error]
        message:
          type: string
          minLength: 1
        occurred_at:
          type: string
          format: date-time
        metadata:
          type: object
          additionalProperties: true
    SyncEvent:
      type: object
      required: [id, type, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [product_imported, product_published, inventory_reconciled, conflict_detected, sync_failed]
        product_id:
          type: string
          format: uuid
        remote_id:
          type: integer
        message:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        created_at:
          type: string
          format: date-time
    SyncStatus:
      type: object
      required: [total_events, pending_conflicts, updated_at]
      properties:
        total_events:
          type: integer
          minimum: 0
        pending_conflicts:
          type: integer
          minimum: 0
        last_event:
          $ref: '#/components/schemas/SyncEvent'
        last_error:
          type: string
        updated_at:
          type: string
          format: date-time
    SyncConflictField:
      type: object
      required: [field, local_value, remote_value]
      properties:
        field:
          type: string
          enum: [title, price, stock, description]
        local_value:
          type: string
        remote_value:
          type: string
    SyncConflict:
      type: object
      required: [id, sku, remote_id, status, fields, created_at]
      properties:
        id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        remote_id:
          type: integer
        status:
          type: string
          enum: [pending, resolved]
        fields:
          type: array
          items:
            $ref: '#/components/schemas/SyncConflictField'
        resolution:
          type: string
        note:
          type: string
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
    ConflictListResponse:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SyncConflict'
    ResolveConflictRequest:
      type: object
      required: [resolution]
      properties:
        resolution:
          type: string
          enum: [local, remote, manual]
          description: "Operator decision: keep local data, accept remote WooCommerce data, or mark as manually reconciled."
        note:
          type: string
    WooCommerceOrderWebhook:
      type: object
      required: [id, status]
      properties:
        id:
          type: integer
          minimum: 1
        status:
          type: string
        total:
          type: string
        currency:
          type: string
        billing:
          type: object
          properties:
            email:
              type: string
              format: email
        line_items:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              product_id:
                type: integer
              quantity:
                type: integer
              total:
                type: string
    WooCommerceProductWebhook:
      type: object
      required: [id, sku, name]
      properties:
        id:
          type: integer
          minimum: 1
        sku:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
