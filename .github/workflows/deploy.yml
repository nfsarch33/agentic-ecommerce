name: Publish Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: Build and push SHA images
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mc-api
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            TARGET=mc-api
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push wc-sync
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            TARGET=wc-sync
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-wc-sync
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push content-worker
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            TARGET=content-worker
            COMMIT=${{ github.sha }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-content-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
