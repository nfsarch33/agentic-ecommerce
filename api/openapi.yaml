openapi: 3.1.0
info:
  title: Agentic Ecommerce Mission Control API
  version: 0.2.0
  description: |
    Public contract for the Agentic Ecommerce Go backend consumed by
    agentic-ecommerce-web. This spec intentionally excludes private
    operator endpoints and credential-bearing surfaces.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/products:
    get:
      summary: List storefront products
      operationId: listProducts
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated product list
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Present when the request origin matches ECOMMERCE_ALLOWED_ORIGIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          description: Missing or invalid bearer token when ECOMMERCE_API_TOKEN is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin rejected by CORS policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate product (SKU or slug collision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (missing SKU, invalid price, etc).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: Products CORS preflight
      operationId: productsPreflight
      responses:
        '204':
          description: Preflight accepted.
        '403':
          description: Origin rejected by CORS policy.
  /api/v1/products/{id}:
    get:
      summary: Get a product by ID or slug
      operationId: getProduct
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product UUID or slug.
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid JSON body or invalid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted.
        '400':
          description: Invalid product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders:
    post:
      summary: Create an order
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Order validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}:
    get:
      summary: Get an order by ID
      operationId: getOrder
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid order ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{id}/status:
    patch:
      summary: Advance order status
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid JSON body or invalid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Order not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Invalid status or status transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/cart/{session_id}:
    get:
      summary: Get a cart session
      operationId: getCart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Cart session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
    put:
      summary: Replace a cart session
      operationId: putCart
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartRequest'
      responses:
        '200':
          description: Cart saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          description: Invalid JSON body or session ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Cart validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: agentic-ecommerce-mc-api
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in the smallest currency unit (for example, cents).
        currency:
          type: string
          enum: [AUD, USD, GBP, EUR]
    Product:
      type: object
      required: [id, sku, title, slug, price, stock, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [draft, active, archived]
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required: [sku, title, price]
      properties:
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        slug:
          type: string
          description: Auto-generated from title if omitted.
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
          default: 0
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
    ProductListResponse:
      type: object
      required: [products, total, page, per_page]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
    ShippingAddress:
      type: object
      required: [name, line1, city, postal_code, country]
      properties:
        name:
          type: string
          minLength: 1
        line1:
          type: string
          minLength: 1
        line2:
          type: string
        city:
          type: string
          minLength: 1
        region:
          type: string
        postal_code:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 2
    Totals:
      type: object
      required: [subtotal, shipping, total]
      properties:
        subtotal:
          $ref: '#/components/schemas/Money'
        shipping:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
    OrderItem:
      type: object
      required: [product_id, sku, title, quantity, unit_price, line_total]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
        line_total:
          $ref: '#/components/schemas/Money'
    OrderItemInput:
      type: object
      required: [product_id, sku, title, quantity, unit_price]
      properties:
        product_id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        unit_price:
          $ref: '#/components/schemas/Money'
    Order:
      type: object
      required: [id, customer_email, items, status, totals, shipping_address, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        customer_email:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        status:
          type: string
          enum: [pending, paid, fulfilled, shipped, completed, failed, cancelled]
        totals:
          $ref: '#/components/schemas/Totals'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateOrderRequest:
      type: object
      required: [customer_email, items, shipping_address]
      properties:
        customer_email:
          type: string
          format: email
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemInput'
        shipping_address:
          $ref: '#/components/schemas/ShippingAddress'
        shipping:
          $ref: '#/components/schemas/Money'
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, paid, fulfilled, shipped, completed, failed, cancelled]
    Cart:
      type: object
      required: [session_id, items, totals, updated_at]
      properties:
        session_id:
          type: string
          minLength: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        totals:
          $ref: '#/components/schemas/Totals'
        updated_at:
          type: string
          format: date-time
    CartRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemInput'
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
