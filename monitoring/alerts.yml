groups:
  - name: agentic-ecommerce-api
    rules:
      - alert: AgenticEcommerceApiDown
        expr: up{job="mc-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "mc-api is not scrapeable"
          description: "Prometheus cannot scrape the mc-api /metrics endpoint."

      - alert: AgenticEcommerceHighApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(agentic_ecommerce_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mc-api p95 latency above 500ms"
          description: "The API p95 latency SLI is above the v1.0.0 warning threshold."

      - alert: AgenticEcommerceHighErrorRate
        expr: |
          (
            sum(rate(agentic_ecommerce_http_requests_total{code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(agentic_ecommerce_http_requests_total[5m])), 1)
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mc-api error rate above 1%"
          description: "The mc-api 5xx error rate exceeded the v1.0.0 warning threshold."

      - alert: AgenticEcommerceSyncLagHigh
        expr: agentic_ecommerce_sync_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WooCommerce sync lag above 5 minutes"
          description: "The sync lag metric is above the v1.0.0 warning threshold."

      - alert: AgenticEcommerceAgentFailureRateHigh
        expr: |
          (
            sum(rate(agentic_ecommerce_agent_worker_runs_total{status="failed"}[10m]))
            /
            clamp_min(sum(rate(agentic_ecommerce_agent_worker_runs_total[10m])), 0.001)
          ) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Agent worker failure rate above 5%"
          description: "More than 5% of agent-worker orchestrator runs failed over the last 10 minutes."

      - alert: AgenticEcommerceComplianceFailureSpike
        expr: |
          (
            (sum(increase(agentic_ecommerce_compliance_failures_total[15m])) or vector(0))
            +
            (sum(increase(agentic_ecommerce_agent_worker_compliance_failures_total[15m])) or vector(0))
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Compliance failure spike detected"
          description: "Backend and worker compliance failures exceeded the v1.0.0 spike threshold in 15 minutes."

      - alert: AgenticEcommerceAgentSuccessMissing
        expr: increase(agentic_ecommerce_agent_success_total[30m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No agent success events observed"
          description: "The agent success counter has not moved in the last 30 minutes. This is informational while agent workers are scaffolded."
