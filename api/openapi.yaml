  # v2.5.0 Stripe webhook (signature-authenticated, no bearer).
  /webhooks/stripe:
    post:
      summary: Stripe webhook receiver
      operationId: stripeWebhook
      description: |
        Authenticated via Stripe-Signature header (HMAC-SHA256, 5-minute
        replay window). Idempotent on Stripe event_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Event processed (or duplicate, no-op).
        '400':
          description: Missing or malformed Stripe-Signature header.
        '401':
          description: Signature mismatch or replay window exceeded.
components:
  parameters:
    TenantIDHeader:
      name: X-Tenant-ID
      in: header
      required: false
      schema:
        type: string
      description: Tenant scope for MVP requests when the JWT does not carry a tenant_id claim.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HMAC-signed JWT access token issued by `/api/v1/auth/login` or `/api/v1/auth/refresh`.
  schemas:
    LoginRequest:
      type: object
      required: [password]
      description: Supply either username or email plus password.
      properties:
        username:
          type: string
          example: admin@example.invalid
        email:
          type: string
          format: email
          example: admin@example.invalid
        password:
          type: string
          format: password
          example: ${ECOMMERCE_ADMIN_PASSWORD}
    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          description: Opaque refresh token returned by the login or refresh endpoint.
    AuthTokenResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, role, session]
      properties:
        access_token:
          type: string
          description: Short-lived JWT access token.
        refresh_token:
          type: string
          description: Opaque refresh token. Store securely and never log.
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          minimum: 1
          description: Access token lifetime in seconds.
        role:
          type: string
          enum: [admin, operator, viewer]
        session:
          $ref: '#/components/schemas/AuthSession'
    AuthSession:
      type: object
      required: [user, expires_at]
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        expires_at:
          type: string
          format: date-time
    AuthUser:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, operator, viewer]
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: agentic-ecommerce-mc-api
    ReadyResponse:
      type: object
      required: [status, service, agents, agent_worker, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        service:
          type: string
          const: agentic-ecommerce-mc-api
        agents:
          type: integer
          minimum: 0
        agent_worker:
          $ref: '#/components/schemas/AgentWorkerReadiness'
        checks:
          type: object
          required: [database, redis, eventbus]
          properties:
            database:
              $ref: '#/components/schemas/DependencyReadiness'
            redis:
              $ref: '#/components/schemas/DependencyReadiness'
            eventbus:
              $ref: '#/components/schemas/DependencyReadiness'
    DependencyReadiness:
      type: object
      required: [status, optional, latency_ms]
      properties:
        status:
          type: string
          enum: [ok, fail, skipped]
        optional:
          type: boolean
          description: True when the dependency is not configured and therefore does not gate readiness.
        latency_ms:
          type: integer
          minimum: 0
        error:
          type: string
          description: Present only for failed checks. The value is intentionally generic to avoid leaking connection details.
        detail:
          type: string
          enum: [dependency_failed, dependency_timeout]
          description: Cloud load-balancer-safe failure detail without connection strings, credentials, hosts, or provider secrets.
    AgentWorkerReadiness:
      type: object
      required: [ready, scheduler, registered_agents]
      properties:
        ready:
          type: boolean
        scheduler:
          type: string
          enum: [in_process]
        registered_agents:
          type: integer
          minimum: 0
    AgentDescriptor:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          enum: [sourcing, pricing, compliance]
        name:
          type: string
        description:
          type: string
        capabilities:
          type: array
          items:
            type: string
    AgentsListResponse:
      type: object
      required: [agents]
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentDescriptor'
    AgentRunRequest:
      type: object
      properties:
        priority:
          type: integer
          default: 0
        payload:
          type: object
          additionalProperties: true
          description: Structured agent-specific input. Examples include sourcing candidates, pricing cost/competition data, or content compliance payloads.
    AgentRunError:
      type: object
      properties:
        code:
          type: string
        detail:
          type: string
    AgentRun:
      type: object
      required: [id, task_id, agent_id, state, priority, created_at]
      properties:
        id:
          type: string
          format: uuid
        task_id:
          type: string
          format: uuid
        agent_id:
          type: string
          enum: [sourcing, pricing, compliance]
        state:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        priority:
          type: integer
        input:
          type: object
          additionalProperties: true
        result:
          type: object
          additionalProperties: true
        error:
          $ref: '#/components/schemas/AgentRunError'
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
    AgentHistoryResponse:
      type: object
      required: [runs]
      properties:
        runs:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
    AgentSchedule:
      type: object
      required: [id, agent_id, enabled, priority, payload, created_at, updated_at]
      properties:
        id:
          type: string
        agent_id:
          type: string
          enum: [sourcing, pricing, compliance]
        cron:
          type: string
          description: Optional cron-like schedule expression when configured.
        interval_seconds:
          type: integer
          minimum: 0
          description: Deterministic interval fallback used by in-repo schedules.
        enabled:
          type: boolean
        priority:
          type: integer
        payload:
          type: object
          additionalProperties: true
        next_run_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AgentSchedulesResponse:
      type: object
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: '#/components/schemas/AgentSchedule'
    AgentScheduleResponse:
      type: object
      required: [schedule]
      properties:
        schedule:
          $ref: '#/components/schemas/AgentSchedule'
    CreateWebhookRequest:
      type: object
      required: [url, event_types, secret]
      properties:
        url:
          type: string
          format: uri
          description: HTTP or HTTPS endpoint that receives signed JSON events.
        event_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [agent.run.completed, compliance.checked, order.placed, product.created, product.updated, sync.completed]
        secret:
          type: string
          format: password
          minLength: 1
          writeOnly: true
          description: HMAC signing secret. Accepted only on create and never returned by the API.
        secret_ref:
          type: string
          description: Optional operator-managed secret reference for future durable secret stores.
        enabled:
          type: boolean
          default: true
    TestWebhookRequest:
      type: object
      properties:
        event_type:
          type: string
          enum: [agent.run.completed, compliance.checked, order.placed, product.created, product.updated, sync.completed]
          description: Optional subscribed event type to use for the test delivery. Defaults to the first registered type.
    WebhookRegistration:
      type: object
      required: [id, url, event_types, secret_hash, enabled, created_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          description: Tenant scope for tenant-scoped webhook registrations.
        url:
          type: string
          format: uri
        event_types:
          type: array
          items:
            type: string
            enum: [agent.run.completed, compliance.checked, order.placed, product.created, product.updated, sync.completed]
        secret_ref:
          type: string
        secret_hash:
          type: string
          description: SHA-256 hash fingerprint of the signing secret, never the secret value.
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
    WebhookListResponse:
      type: object
      required: [webhooks]
      properties:
        webhooks:
          type: array
          items:
            $ref: '#/components/schemas/WebhookRegistration'
    WebhookDeliveryResult:
      type: object
      required: [webhook_id, event_id, event_type, success, status, attempts, created_at]
      properties:
        id:
          type: string
          format: uuid
        webhook_id:
          type: string
          format: uuid
        event_id:
          type: string
        event_type:
          type: string
          enum: [agent.run.completed, compliance.checked, order.placed, product.created, product.updated, sync.completed]
        success:
          type: boolean
        status:
          type: integer
          minimum: 0
          description: HTTP response status, or 0 when no response was received.
        attempts:
          type: integer
          minimum: 0
        error:
          type: string
          description: Sanitised machine-readable delivery failure reason.
        created_at:
          type: string
          format: date-time
    WebhookTestResponse:
      type: object
      required: [delivery]
      properties:
        delivery:
          $ref: '#/components/schemas/WebhookDeliveryResult'
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in the smallest currency unit (for example, cents).
        currency:
          type: string
          enum: [AUD, USD, GBP, EUR]
    Product:
      type: object
      required: [id, sku, title, slug, price, stock, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [draft, active, archived]
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateProductRequest:
      type: object
      required: [sku, title, price]
      properties:
        sku:
          type: string
          minLength: 1
        title:
          type: string
          minLength: 1
        slug:
          type: string
          description: Auto-generated from title if omitted.
        description:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
          default: 0
        status:
          type: string
          enum: [draft, active, archived]
          default: draft
    ProductListResponse:
      type: object
      required: [products, total, page, per_page]
      properties:
        products:
          type: array
          items:
            $ref: '#/components/schemas/Product'
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
          minimum: 1
    GenerateDescriptionRequest:
      type: object
      properties:
        style:
          type: string
          enum: [professional, casual, luxury, technical]
          default: professional
        language:
          type: string
          default: en-AU
        max_words:
          type: integer
          minimum: 20
          maximum: 500
          default: 120
        keywords:
          type: array
          items:
            type: string
    ContentSuggestion:
      type: object
      required: [product_id, description, seo_title, meta_description, score, pass, tokens_used, evaluation]
      properties:
        product_id:
          type: string
          format: uuid
        description:
          type: string
        seo_title:
          type: string
          maxLength: 60
        meta_description:
          type: string
          maxLength: 160
        score:
          type: integer
          minimum: 0
          maximum: 100
        pass:
          type: boolean
        tokens_used:
          type: integer
          minimum: 0
        evaluation:
          $ref: '#/components/schemas/ContentEvaluation'
    GenerateFactCheckedContentRequest:
      type: object
      required: [product_id]
      properties:
        product_id:
          type: string
          format: uuid
        style:
          type: string
          enum: [professional, casual, luxury, technical]
          default: professional
        language:
          type: string
          default: en-AU
        max_words:
          type: integer
          minimum: 20
          maximum: 500
          default: 120
        keywords:
          type: array
          items:
            type: string
    ContentFactCheckResponse:
      type: object
      required: [fact_check_id, product_id, description, seo_title, meta_description, score, pass, tokens_used, evaluation, fact_check]
      properties:
        fact_check_id:
          type: string
        product_id:
          type: string
          format: uuid
        description:
          type: string
        seo_title:
          type: string
        meta_description:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        pass:
          type: boolean
        tokens_used:
          type: integer
          minimum: 0
        evaluation:
          $ref: '#/components/schemas/ContentEvaluation'
        fact_check:
          $ref: '#/components/schemas/FactCheckResult'
    FactCheckResult:
      type: object
      required: [pass, confidence, claims, issues]
      properties:
        id:
          type: string
        product_id:
