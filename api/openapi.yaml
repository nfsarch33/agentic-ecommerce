openapi: 3.1.0
info:
  title: Agentic Ecommerce Mission Control API
  version: 2.9.0
  description: |
    Public v1.x.y contract for the Agentic Ecommerce Go backend consumed by
    agentic-ecommerce-web. This spec intentionally excludes private
    operator endpoints and credential-bearing surfaces. Protected endpoints
    use short-lived HMAC-signed JWT bearer tokens and RBAC roles:
    admin, operator, and viewer.

    Version policy: v1 endpoints are stable through host v3.x. The
    v2 preview surface (api/openapi-v2-preview.yaml) is opt-in only
    and subject to change without notice. See docs/api-versioning.md
    for negotiation, deprecation timeline, and Accept-header opt-in.
  x-api-version-policy: |
    v1 endpoints are stable through v3.x; v2 preview endpoints are
    subject to change without notice. See docs/api-versioning.md.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness check
      operationId: getReadyz
      responses:
        '200':
          description: Service readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '503':
          description: Service is live but not ready because a configured dependency check failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /metrics:
    get:
      summary: Prometheus metrics
      operationId: getMetrics
      responses:
        '200':
          description: Prometheus text exposition for build metadata, HTTP RED metrics, sync, agent, compliance, and media placeholders.
          content:
            text/plain:
              schema:
                type: string
        '405':
          description: Only GET is supported.
  /api/v1/auth/login:
    post:
      summary: Bootstrap admin login
      operationId: login
      description: |
        Development/admin bootstrap login. Credentials must be supplied via
        runtime configuration; the API contract intentionally uses placeholders
        and does not define real secrets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT access token and refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: JWT auth or admin credentials are not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      summary: Refresh JWT access token
      operationId: refreshAccessToken
      description: Rotates a configured refresh session and returns a new access token pair.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: New JWT access token and refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Invalid or expired refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: JWT auth is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/me:
    get:
      summary: Get current authenticated session
      operationId: getCurrentSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current session derived from the JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/logout:
    post:
      summary: Validate logout request
      operationId: logout
      description: Stateless JWT logout endpoint for BFF compatibility. Clients clear their own httpOnly session cookie.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Bearer token accepted; client may clear its session cookie.
        '401':
          description: Missing, invalid, or expired JWT bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products:
    get:
      summary: List storefront products
      operationId: listProducts
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Paginated product list
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Present when the request origin matches ECOMMERCE_ALLOWED_ORIGIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        '401':
          description: Missing or invalid JWT bearer token when auth is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin rejected by CORS policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a product
      operationId: createProduct
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Duplicate product (SKU or slug collision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed (missing SKU, invalid price, etc).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: Products CORS preflight
      operationId: productsPreflight
      responses:
        '204':
          description: Preflight accepted.
        '403':
          description: Origin rejected by CORS policy.
  /api/v1/products/{id}:
    get:
      summary: Get a product by ID or slug
      operationId: getProduct
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Product UUID or slug.
      responses:
        '200':
          description: Product found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update a product
      operationId: updateProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '400':
          description: Invalid JSON body or invalid ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a product
      operationId: deleteProduct
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted.
        '400':
          description: Invalid product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/generate-description:
    post:
      summary: Generate AI product content suggestions
      operationId: generateProductDescription
      description: Uses the configured fleet AI bridge. The backend never calls MiniMax directly.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateDescriptionRequest'
      responses:
        '200':
          description: Generated content suggestion and quality evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSuggestion'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fleet bridge generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Content agent is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/ai-suggestions:
    get:
      summary: Get AI content suggestions for a product
      operationId: getProductAISuggestions
      description: Generates non-persisted product description, SEO title, and meta description suggestions.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Generated content suggestion and quality evaluation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentSuggestion'
        '400':
          description: Invalid product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Fleet bridge generation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Content agent is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rag/documents:
    post:
      summary: Ingest a RAG source document
      operationId: ingestRAGDocument
      description: Chunks and embeds source material for fact-check evidence search. Embeddings are produced through the configured embedding port; the backend never calls MiniMax directly.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RAGDocumentRequest'
      responses:
        '201':
          description: Document accepted and chunked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGIngestResponse'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Empty or invalid source document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: RAG service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/rag/search:
    get:
      summary: Search fact-check evidence
      operationId: searchRAGEvidence
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - name: top_k
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: Ranked evidence chunks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RAGSearchResponse'
        '400':
          description: Missing query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: RAG service is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/content/generate:
    post:
      summary: Generate product content with fact-checking
      operationId: generateFactCheckedContent
      description: Generates product copy, extracts factual claims, searches RAG evidence, and returns a combined quality/factual approval decision.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateFactCheckedContentRequest'
      responses:
        '200':
          description: Generated content with fact-check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentFactCheckResponse'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Content generation or fact-checking failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Content generator or fact checker is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/content/fact-checks/{id}:
    get:
      summary: Retrieve a stored fact-check result
      operationId: getFactCheckResult
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Fact-check result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactCheckResult'
        '404':
          description: Fact-check result not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media/source:
    post:
      summary: Source supplier media
      operationId: sourceMedia
      description: Fetches an image from a supplier URL through the backend media intelligence service and extracts deterministic metadata.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaSourceRequest'
      responses:
        '201':
          description: Media asset sourced and registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing or invalid source URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Supplier media fetch failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Media sourcing is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media/process:
    post:
      summary: Process sourced media
      operationId: processMedia
      description: Applies deterministic resize/format stubs and records explicit TODO metadata for background removal.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MediaProcessRequest'
      responses:
        '200':
          description: Processed media asset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '400':
          description: Invalid JSON body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Media asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Missing media ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media/{id}:
    get:
      summary: Get media asset
      operationId: getMedia
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Media asset metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaAsset'
        '404':
          description: Media asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/media/{id}/validate:
    post:
      summary: Validate media quality
      operationId: validateMedia
      description: Runs resolution, aspect ratio, format, alt text, and brand-safety placeholder checks.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Media quality assessment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaQualityReport'
        '404':
          description: Media asset not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/compliance-check:
    post:
      summary: Run product content compliance checks
      operationId: checkProductCompliance
      description: Runs deterministic compliance rules before product publish. This endpoint does not call live AI services.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCheckRequest'
      responses:
        '200':
          description: Compliance check result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCheckResponse'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/products/{id}/seo-suggestions:
    post:
      summary: Generate deterministic SEO suggestions
      operationId: suggestProductSEO
      description: Generates SEO title, meta description, slug, keyword density, and score without live AI calls.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SEOSuggestionRequest'
      responses:
        '200':
          description: SEO suggestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEOSuggestionResponse'
        '400':
          description: Invalid JSON body or product ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Product not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/compliance/rules:
    get:
      summary: List built-in compliance rules
      operationId: listComplianceRules
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Built-in compliance rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceRulesResponse'
  /api/v1/tenant/settings:
    get:
      summary: Get tenant settings
      operationId: getTenantSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
      responses:
        '200':
          description: Tenant-scoped configuration settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '400':
          description: Tenant context is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT bearer token when auth is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update tenant settings
      operationId: updateTenantSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantSettingsUpdate'
      responses:
        '200':
          description: Updated tenant-scoped configuration settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantSettings'
        '400':
          description: Invalid JSON body or missing tenant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT bearer token when auth is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Actor does not have permission to update tenant settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Tenant settings failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/compliance/custom-rules:
    get:
      summary: List tenant custom compliance rules
      operationId: listCustomComplianceRules
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
      responses:
        '200':
          description: Tenant-scoped custom compliance rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCustomRulesResponse'
        '400':
          description: Tenant context is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create tenant custom compliance rule
      operationId: createCustomComplianceRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCustomRuleRequest'
      responses:
        '201':
          description: Custom compliance rule created at version 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplianceCustomRule'
        '400':
          description: Invalid JSON body or missing tenant context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid JWT bearer token when auth is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Actor does not have permission to mutate custom rules.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Custom rule validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/compliance/custom-rules/{id}:
    put:
      summary: Update tenant custom compliance rule
      operationId: updateCustomComplianceRule
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantIDHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplianceCustomRuleUpdate'
      responses:
        '200':
          description: Custom compliance rule updated with incremented version.
          content:
