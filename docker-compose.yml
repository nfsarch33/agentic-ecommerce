name: agentic-ecommerce

x-app-common: &app-common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  networks:
    - ecommerce
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: pgvector/pgvector:pg16
    <<: *app-common
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ecommerce} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    <<: *app-common
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./configs/redis-streams.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    <<: *app-common
    profiles: ["media-objectstore"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_API_HOST_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  temporal:
    image: temporalio/temporal:${TEMPORAL_IMAGE_TAG:-latest}
    <<: *app-common
    profiles: ["temporal", "temporal-worker"]
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --port
      - "7233"
      - --ui-port
      - "8233"
      - --db-filename
      - /tmp/temporal.db
      - --namespace
      - default
    ports:
      - "${BIND_HOST:-127.0.0.1}:${TEMPORAL_GRPC_HOST_PORT:-7233}:7233"
      - "${BIND_HOST:-127.0.0.1}:${TEMPORAL_UI_HOST_PORT:-8233}:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG:-1.88.0}
    <<: *app-common
    profiles: ["n8n"]
    environment:
      N8N_HOST: ${N8N_HOST:-127.0.0.1}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678/}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://127.0.0.1:5678/}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_ERROR: ${N8N_EXECUTIONS_DATA_SAVE_ON_ERROR:-all}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${N8N_EXECUTIONS_DATA_SAVE_ON_SUCCESS:-none}
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      TZ: ${GENERIC_TIMEZONE:-UTC}
      SLACK_WEBHOOK_URL: ${N8N_SLACK_WEBHOOK_URL:-}
      ORDER_EMAIL_ENDPOINT_URL: ${N8N_ORDER_EMAIL_ENDPOINT_URL:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:5678/healthz',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1)})\""
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  mc-api:
    <<: *app-common
    image: ghcr.io/nfsarch33/agentic-ecommerce:${ECOMMERCE_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
        COMMIT: ${COMMIT:-local}
        TARGET: mc-api
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_HTTP_ADDR: 0.0.0.0:8080
      ECOMMERCE_DB_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable
      ECOMMERCE_REDIS_ADDR: redis:6379
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:prod:}
      ECOMMERCE_READINESS_TIMEOUT: ${ECOMMERCE_READINESS_TIMEOUT:-2s}
      ECOMMERCE_SHUTDOWN_TIMEOUT: ${ECOMMERCE_SHUTDOWN_TIMEOUT:-10s}
      ECOMMERCE_OTEL_ENABLED: ${ECOMMERCE_OTEL_ENABLED:-false}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: redis:6379
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_EVENTBUS_CONSUMER_GROUP: ${ECOMMERCE_EVENTBUS_CONSUMER_GROUP:-ec-api-group}
      ECOMMERCE_EVENTBUS_STREAMS: ${ECOMMERCE_EVENTBUS_STREAMS:-ec.product.events,ec.order.events,ec.sync.events,ec.agent.events,ec.compliance.events}
      ECOMMERCE_JWT_SECRET: ${ECOMMERCE_JWT_SECRET:-}
      ECOMMERCE_JWT_ISSUER: ${ECOMMERCE_JWT_ISSUER:-agentic-ecommerce}
      ECOMMERCE_JWT_AUDIENCE: ${ECOMMERCE_JWT_AUDIENCE:-mc-api}
      ECOMMERCE_JWT_ACCESS_TTL: ${ECOMMERCE_JWT_ACCESS_TTL:-15m}
      ECOMMERCE_REFRESH_TTL: ${ECOMMERCE_REFRESH_TTL:-24h}
      ECOMMERCE_ADMIN_USERNAME: ${ECOMMERCE_ADMIN_USERNAME:-}
      ECOMMERCE_ADMIN_PASSWORD: ${ECOMMERCE_ADMIN_PASSWORD:-}
      ECOMMERCE_ADMIN_ROLE: ${ECOMMERCE_ADMIN_ROLE:-admin}
      ECOMMERCE_RATE_LIMIT_CAPACITY: ${ECOMMERCE_RATE_LIMIT_CAPACITY:-120}
      ECOMMERCE_RATE_LIMIT_REFILL: ${ECOMMERCE_RATE_LIMIT_REFILL:-1m}
      ECOMMERCE_API_TOKEN: ${ECOMMERCE_API_TOKEN:-}
      ECOMMERCE_ALLOWED_ORIGIN: ${ECOMMERCE_ALLOWED_ORIGIN:-}
      ECOMMERCE_WC_STORE_URL: ${ECOMMERCE_WC_STORE_URL:-}
      ECOMMERCE_WC_CONSUMER_KEY: ${ECOMMERCE_WC_CONSUMER_KEY:-}
      ECOMMERCE_WC_CONSUMER_SECRET: ${ECOMMERCE_WC_CONSUMER_SECRET:-}
      ECOMMERCE_WC_WEBHOOK_SECRET: ${ECOMMERCE_WC_WEBHOOK_SECRET:-}
      ECOMMERCE_AI_BRIDGE_URL: ${ECOMMERCE_AI_BRIDGE_URL:-}
      ECOMMERCE_AI_MODEL: ${ECOMMERCE_AI_MODEL:-}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
      ECOMMERCE_MEDIA_STORAGE_DRIVER: ${ECOMMERCE_MEDIA_STORAGE_DRIVER:-filesystem}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_BASE_PATH: ${ECOMMERCE_MEDIA_BASE_PATH:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_BUCKET: ${ECOMMERCE_MEDIA_BUCKET:-}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_MEDIA_REGION: ${ECOMMERCE_MEDIA_REGION:-}
      ECOMMERCE_MEDIA_ENDPOINT: ${ECOMMERCE_MEDIA_ENDPOINT:-}
      ECOMMERCE_MEDIA_FORCE_PATH_STYLE: ${ECOMMERCE_MEDIA_FORCE_PATH_STYLE:-false}
      ECOMMERCE_MEDIA_ACCESS_KEY_ID: ${ECOMMERCE_MEDIA_ACCESS_KEY_ID:-}
      ECOMMERCE_MEDIA_SECRET_ACCESS_KEY: ${ECOMMERCE_MEDIA_SECRET_ACCESS_KEY:-}
      ECOMMERCE_MEDIA_MAX_SIZE_BYTES: ${ECOMMERCE_MEDIA_MAX_SIZE_BYTES:-5242880}
      ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES: ${ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE: ${ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE:-70}
      ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES: ${ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES:-5242880}
      ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES: ${ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MC_API_HOST_PORT:-8080}:8080"
    volumes:
      - media-assets:/var/lib/agentic-ecommerce/media
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    <<: *app-common
    image: ghcr.io/nfsarch33/agentic-ecommerce-web:${WEB_IMAGE_TAG:-main}
    depends_on:
      mc-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MC_API_BASE_URL: ${MC_API_BASE_URL:-http://mc-api:8080}
      FLEET_AI_BRIDGE_URL: ${FLEET_AI_BRIDGE_URL:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"const http=require('http');const req=http.get('http://127.0.0.1:3000',res=>process.exit(res.statusCode<500?0:1));req.on('error',()=>process.exit(1));req.setTimeout(2000,()=>{req.destroy();process.exit(1)})\""
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  wc-sync:
    <<: *app-common
    image: ghcr.io/nfsarch33/agentic-ecommerce:${ECOMMERCE_IMAGE_TAG:-dev}-wc-sync
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
        COMMIT: ${COMMIT:-local}
        TARGET: wc-sync
    profiles: ["workers", "sync"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mc-api:
        condition: service_healthy
    environment:
      ECOMMERCE_WC_BASE_URL: ${ECOMMERCE_WC_BASE_URL:-}
      ECOMMERCE_WC_CONSUMER_KEY: ${ECOMMERCE_WC_CONSUMER_KEY:-}
      ECOMMERCE_WC_CONSUMER_SECRET: ${ECOMMERCE_WC_CONSUMER_SECRET:-}
      ECOMMERCE_SYNC_MODE: ${ECOMMERCE_SYNC_MODE:-once}
      ECOMMERCE_SYNC_DRY_RUN: ${ECOMMERCE_SYNC_DRY_RUN:-true}
      ECOMMERCE_DB_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable
      ECOMMERCE_REDIS_ADDR: redis:6379
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: redis:6379
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}

  content-worker:
    <<: *app-common
    image: ghcr.io/nfsarch33/agentic-ecommerce:${ECOMMERCE_IMAGE_TAG:-dev}-content-worker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
        COMMIT: ${COMMIT:-local}
        TARGET: content-worker
    profiles: ["workers"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      mc-api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_AI_BRIDGE_URL: ${ECOMMERCE_AI_BRIDGE_URL:-}
      ECOMMERCE_AI_MODEL: ${ECOMMERCE_AI_MODEL:-}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
      ECOMMERCE_REDIS_ADDR: redis:6379

  agent-worker:
    <<: *app-common
    image: ghcr.io/nfsarch33/agentic-ecommerce:${ECOMMERCE_IMAGE_TAG:-dev}-agent-worker
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
        COMMIT: ${COMMIT:-local}
        TARGET: agent-worker
    profiles: ["workers"]
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_AGENT_WORKER_ENABLED: ${ECOMMERCE_AGENT_WORKER_ENABLED:-true}
      ECOMMERCE_AGENT_WORKER_RUN_ONCE: ${ECOMMERCE_AGENT_WORKER_RUN_ONCE:-false}
      ECOMMERCE_AGENT_WORKER_CONCURRENCY: ${ECOMMERCE_AGENT_WORKER_CONCURRENCY:-1}
      ECOMMERCE_AGENT_WORKER_INTERVAL: ${ECOMMERCE_AGENT_WORKER_INTERVAL:-5m}
      ECOMMERCE_AGENT_WORKER_METRICS_ADDR: 0.0.0.0:8081
      ECOMMERCE_DB_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable
      ECOMMERCE_REDIS_ADDR: redis:6379
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:prod:}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: redis:6379
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE: ${ECOMMERCE_COMPLIANCE_MIN_SEO_SCORE:-70}
      ECOMMERCE_MEDIA_STORAGE_DRIVER: ${ECOMMERCE_MEDIA_STORAGE_DRIVER:-filesystem}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_BASE_PATH: ${ECOMMERCE_MEDIA_BASE_PATH:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_BUCKET: ${ECOMMERCE_MEDIA_BUCKET:-}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_MEDIA_REGION: ${ECOMMERCE_MEDIA_REGION:-}
      ECOMMERCE_MEDIA_ENDPOINT: ${ECOMMERCE_MEDIA_ENDPOINT:-}
      ECOMMERCE_MEDIA_FORCE_PATH_STYLE: ${ECOMMERCE_MEDIA_FORCE_PATH_STYLE:-false}
      ECOMMERCE_MEDIA_ACCESS_KEY_ID: ${ECOMMERCE_MEDIA_ACCESS_KEY_ID:-}
      ECOMMERCE_MEDIA_SECRET_ACCESS_KEY: ${ECOMMERCE_MEDIA_SECRET_ACCESS_KEY:-}
      ECOMMERCE_MEDIA_MAX_SIZE_BYTES: ${ECOMMERCE_MEDIA_MAX_SIZE_BYTES:-5242880}
      ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES: ${ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
      ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES: ${ECOMMERCE_COMPLIANCE_MAX_IMAGE_SIZE_BYTES:-5242880}
      ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES: ${ECOMMERCE_COMPLIANCE_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${AGENT_WORKER_METRICS_HOST_PORT:-8082}:8081"
    volumes:
      - media-assets:/var/lib/agentic-ecommerce/media
    healthcheck:
      test: ["CMD", "/app", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  temporal-worker:
    <<: *app-common
    image: ${TEMPORAL_WORKER_IMAGE:-ghcr.io/nfsarch33/agentic-ecommerce:dev-temporal-worker}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${VERSION:-v1.0.0}
        COMMIT: ${COMMIT:-local}
        TARGET: temporal-worker
    profiles: ["temporal-worker"]
    depends_on:
      temporal:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ECOMMERCE_TEMPORAL_ADDR: ${ECOMMERCE_TEMPORAL_ADDR:-temporal:7233}
      ECOMMERCE_TEMPORAL_NAMESPACE: ${ECOMMERCE_TEMPORAL_NAMESPACE:-default}
      ECOMMERCE_TEMPORAL_TASK_QUEUE: ${ECOMMERCE_TEMPORAL_TASK_QUEUE:-ec-workflows}
      ECOMMERCE_DB_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-change-me-postgres}@postgres:5432/${POSTGRES_DB:-ecommerce}?sslmode=disable
      ECOMMERCE_REDIS_ADDR: redis:6379
      ECOMMERCE_REDIS_DB: ${ECOMMERCE_REDIS_DB:-0}
      ECOMMERCE_REDIS_KEY_PREFIX: ${ECOMMERCE_REDIS_KEY_PREFIX:-ec:prod:}
      ECOMMERCE_EVENTBUS_DRIVER: ${ECOMMERCE_EVENTBUS_DRIVER:-redis}
      ECOMMERCE_EVENTBUS_REDIS_ADDR: redis:6379
      ECOMMERCE_EVENTBUS_REDIS_DB: ${ECOMMERCE_EVENTBUS_REDIS_DB:-0}
      ECOMMERCE_EVENTBUS_CHANNEL_SYNC: ${ECOMMERCE_EVENTBUS_CHANNEL_SYNC:-ec.sync.events}
      ECOMMERCE_EVENTBUS_CHANNEL_DLQ: ${ECOMMERCE_EVENTBUS_CHANNEL_DLQ:-ec.sync.deadletter}
      ECOMMERCE_EMBEDDING_BRIDGE_URL: ${ECOMMERCE_EMBEDDING_BRIDGE_URL:-}
      ECOMMERCE_EMBEDDING_MODEL: ${ECOMMERCE_EMBEDDING_MODEL:-minimax-embedding-01}
      ECOMMERCE_EMBEDDING_DIMENSIONS: ${ECOMMERCE_EMBEDDING_DIMENSIONS:-1536}
      ECOMMERCE_RAG_CHUNK_SIZE: ${ECOMMERCE_RAG_CHUNK_SIZE:-1000}
      ECOMMERCE_MEDIA_STORAGE_DRIVER: ${ECOMMERCE_MEDIA_STORAGE_DRIVER:-filesystem}
      ECOMMERCE_MEDIA_STORE: ${ECOMMERCE_MEDIA_STORE:-filesystem}
      ECOMMERCE_MEDIA_BASE_PATH: ${ECOMMERCE_MEDIA_BASE_PATH:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_ROOT: ${ECOMMERCE_MEDIA_ROOT:-/var/lib/agentic-ecommerce/media}
      ECOMMERCE_MEDIA_BUCKET: ${ECOMMERCE_MEDIA_BUCKET:-}
      ECOMMERCE_MEDIA_PUBLIC_BASE_URL: ${ECOMMERCE_MEDIA_PUBLIC_BASE_URL:-/media}
      ECOMMERCE_MEDIA_REGION: ${ECOMMERCE_MEDIA_REGION:-}
      ECOMMERCE_MEDIA_ENDPOINT: ${ECOMMERCE_MEDIA_ENDPOINT:-}
      ECOMMERCE_MEDIA_FORCE_PATH_STYLE: ${ECOMMERCE_MEDIA_FORCE_PATH_STYLE:-false}
      ECOMMERCE_MEDIA_ACCESS_KEY_ID: ${ECOMMERCE_MEDIA_ACCESS_KEY_ID:-}
      ECOMMERCE_MEDIA_SECRET_ACCESS_KEY: ${ECOMMERCE_MEDIA_SECRET_ACCESS_KEY:-}
      ECOMMERCE_MEDIA_MAX_SIZE_BYTES: ${ECOMMERCE_MEDIA_MAX_SIZE_BYTES:-5242880}
      ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES: ${ECOMMERCE_MEDIA_ALLOWED_MIME_TYPES:-image/jpeg,image/png,image/webp}
    volumes:
      - media-assets:/var/lib/agentic-ecommerce/media

  minimax-openai-bridge:
    image: ghcr.io/nfsarch33/minimax-openai-bridge:${MINIMAX_BRIDGE_IMAGE_TAG:-main}
    <<: *app-common
    profiles: ["ai-bridge"]
    environment:
      MINIMAX_API_KEY_1: ${MINIMAX_API_KEY_1:-}
      MINIMAX_API_KEY_2: ${MINIMAX_API_KEY_2:-}
      MINIMAX_BASE_URL: ${MINIMAX_BASE_URL:-}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIMAX_BRIDGE_HOST_PORT:-8090}:8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"
        ]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.55.1
    <<: *app-common
    user: "65534:65534"
    depends_on:
      mc-api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s

  grafana:
    image: grafana/grafana:11.4.0
    <<: *app-common
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${BIND_HOST:-127.0.0.1}:${GRAFANA_HOST_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  ecommerce:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  temporal-data:
  media-assets:
  minio-data:
  n8n-data:
  prometheus-data:
  grafana-data:
