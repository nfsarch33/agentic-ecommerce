name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run race tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Run govulncheck when available
        run: |
          if command -v govulncheck >/dev/null 2>&1; then
            govulncheck ./...
          else
            echo "govulncheck not installed; skipping optional vulnerability check"
          fi

      - name: Build binaries
        run: make build

  compose:
    name: Compose and Docker build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate full stack compose
        run: docker compose --env-file .env.compose.example -f docker-compose.yml config --quiet

      - name: Build mc-api image
        run: docker build --build-arg TARGET=mc-api --build-arg COMMIT=${{ github.sha }} -t agentic-ecommerce:${{ github.sha }} .

      - name: Build wc-sync image
        run: docker build --build-arg TARGET=wc-sync --build-arg COMMIT=${{ github.sha }} -t agentic-ecommerce:${{ github.sha }}-wc-sync .

      - name: Build content-worker image
        run: docker build --build-arg TARGET=content-worker --build-arg COMMIT=${{ github.sha }} -t agentic-ecommerce:${{ github.sha }}-content-worker .
