name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go gates
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run gitleaks secret scan
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect --source=/repo --no-git --redact --verbose

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Download Go modules
        run: go mod download

      - name: Run race tests
        run: go test -race ./...

      - name: Run go vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Build binaries
        run: make build

  compose:
    name: Compose and Docker build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate full stack compose
        run: docker compose --env-file .env.compose.example -f docker-compose.yml config --quiet

      - name: Build mc-api image
        run: docker build --build-arg TARGET=mc-api --build-arg COMMIT=${{ github.sha }} -t agentic-ecommerce:${{ github.sha }} .

      - name: Build wc-sync image
        run: docker build --build-arg TARGET=wc-sync --build-arg COMMIT=${{ github.sha }} -t agentic-ecommerce:${{ github.sha }}-wc-sync .

      - name: Build content-worker image
        run: docker build --build-arg TARGET=content-worker --build-arg COMMIT=${{ github.sha }} -t agentic-ecommerce:${{ github.sha }}-content-worker .

      - name: Scan mc-api image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan wc-sync image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}-wc-sync
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan content-worker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agentic-ecommerce:${{ github.sha }}-content-worker
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
