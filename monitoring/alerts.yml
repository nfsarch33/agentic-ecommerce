groups:
  - name: agentic-ecommerce-api
    rules:
      - alert: AgenticEcommerceApiDown
        expr: up{job="mc-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "mc-api is not scrapeable"
          description: "Prometheus cannot scrape the mc-api /metrics endpoint."

      - alert: AgenticEcommerceHighApiLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(agentic_ecommerce_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mc-api p95 latency above 500ms"
          description: "The API latency dashboard stub is above the v0.5.0 warning threshold."

      - alert: AgenticEcommerceHighErrorRate
        expr: |
          (
            sum(rate(agentic_ecommerce_http_requests_total{code=~"5.."}[5m]))
            /
            clamp_min(sum(rate(agentic_ecommerce_http_requests_total[5m])), 1)
          ) > 0.01
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "mc-api error rate above 1%"
          description: "The API error rate dashboard stub exceeded the v0.5.0 warning threshold."

      - alert: AgenticEcommerceSyncLagHigh
        expr: agentic_ecommerce_sync_lag_seconds > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "WooCommerce sync lag above 5 minutes"
          description: "The sync lag metric is above the v0.5.0 warning threshold."

      - alert: AgenticEcommerceAgentSuccessMissing
        expr: increase(agentic_ecommerce_agent_success_total[30m]) == 0
        for: 30m
        labels:
          severity: info
        annotations:
          summary: "No agent success events observed"
          description: "The agent success counter has not moved in the last 30 minutes. This is informational while agent workers are scaffolded."
