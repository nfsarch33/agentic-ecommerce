name: Build and Publish Images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: nfsarch33/agentic-ecommerce

jobs:
  publish:
    name: Publish GHCR images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push mc-api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TARGET=mc-api
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push wc-sync
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TARGET=wc-sync
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-wc-sync
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-wc-sync
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push content-worker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            TARGET=content-worker
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-content-worker
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-content-worker
          cache-from: type=gha
          cache-to: type=gha,mode=max
