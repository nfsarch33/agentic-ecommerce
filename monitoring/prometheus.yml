global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: mc-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - mc-api:8080
        labels:
          service: mc-api
          stack: agentic-ecommerce

  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          service: prometheus
          stack: agentic-ecommerce
