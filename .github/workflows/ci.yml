name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  go:
    name: Go gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build binaries
        run: make build

  compose:
    name: Compose and Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev compose
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate full stack compose
        run: docker compose --env-file .env.compose.example -f docker-compose.yml config --quiet

      - name: Build mc-api image
        run: docker build --build-arg TARGET=mc-api -t agentic-ecommerce:test .

      - name: Build wc-sync image
        run: docker build --build-arg TARGET=wc-sync -t agentic-ecommerce:test-wc-sync .

      - name: Build content-worker image
        run: docker build --build-arg TARGET=content-worker -t agentic-ecommerce:test-content-worker .
