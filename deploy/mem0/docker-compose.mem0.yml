# Docker Compose for mem0 + Qdrant vector DB.
# Designed to run on the WSL fleet alongside the EC stack.
#
# Usage:
#   docker compose -f docker-compose.mem0.yml up -d
#
# Required env vars (set in .env or export before running):
#   EC_MEM0_LLM_API_KEY  — OpenAI API key for embeddings + LLM
#
# The EC backend connects via EC_MEM0_ENDPOINT=http://<host>:8080

services:
  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    ports:
      - "${EC_QDRANT_PORT:-6333}:6333"
      - "${EC_QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - ./qdrant-config.yaml:/qdrant/config/production.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G

  mem0:
    image: mem0ai/mem0:latest
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
    ports:
      - "${EC_MEM0_PORT:-8080}:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - EC_MEM0_LLM_API_KEY=${EC_MEM0_LLM_API_KEY}
      - EC_MEM0_QDRANT_URL=http://qdrant:6333
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  qdrant_data:
    driver: local
