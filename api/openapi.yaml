    # v2.4.0 -- Marketplace plugin framework + tenant aggregate.
    MarketplacePluginManifest:
      type: object
      required: [slug, name, version, vendor]
      properties:
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
          description: Kebab-case unique identifier.
        name: { type: string }
        version:
          type: string
          pattern: '^[0-9]+\\.[0-9]+\\.[0-9]+$'
        vendor: { type: string }
        description: { type: string }
        category: { type: string }
        homepage_url: { type: string }
        event_subscriptions:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        dependencies:
          type: array
          items: { $ref: '#/components/schemas/MarketplacePluginDependency' }
    MarketplacePluginDependency:
      type: object
      required: [slug]
      properties:
        slug: { type: string }
        constraint:
          type: string
          description: 'Semver constraint: ^X.Y.Z, =X.Y.Z, or empty (treated as caret).'
    MarketplacePluginsListResponse:
      type: object
      required: [plugins, total, page, per_page]
      properties:
        plugins:
          type: array
          items: { $ref: '#/components/schemas/MarketplacePluginManifest' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
    MarketplaceInstallation:
      type: object
      required: [tenant_id, slug, installed_version, state, installed_at, updated_at]
      properties:
        tenant_id: { type: string }
        slug: { type: string }
        installed_version: { type: string }
        state:
          type: string
          enum: [installed, active, deactivated]
        installed_at: { type: string }
        activated_at: { type: string }
        updated_at: { type: string }
    MarketplaceSettingsResponse:
      type: object
      required: [settings]
      properties:
        settings:
          type: object
          additionalProperties: true
    MarketplaceSubmissionRequest:
      type: object
      required: [submitter_email, slug, name, version, vendor]
      properties:
        submitter_email: { type: string, format: email }
        slug:
          type: string
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        name: { type: string }
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        vendor: { type: string }
        description: { type: string }
        category: { type: string }
        homepage_url: { type: string }
        event_subscriptions:
          type: array
          items: { type: string }
        permissions:
          type: array
          items: { type: string }
        dependencies:
          type: array
          items:
            type: object
            properties:
              slug: { type: string }
              constraint: { type: string }
    MarketplaceSubmissionReviewAction:
      type: object
      properties:
        review_notes: { type: string }
    MarketplaceSubmission:
      type: object
      required: [id, tenant_id, submitter_email, manifest, state, submitted_at]
      properties:
        id: { type: string }
        tenant_id: { type: string }
        submitter_email: { type: string }
        manifest: { $ref: '#/components/schemas/MarketplacePluginManifest' }
        state:
          type: string
          enum: [pending_review, approved, rejected]
        review_notes: { type: string }
        submitted_at: { type: string }
        reviewed_at: { type: string }
        reviewer: { type: string }
    MarketplaceSubmissionsListResponse:
      type: object
      required: [submissions, total, page, per_page]
      properties:
        submissions:
          type: array
          items: { $ref: '#/components/schemas/MarketplaceSubmission' }
        total: { type: integer }
        page: { type: integer }
        per_page: { type: integer }
