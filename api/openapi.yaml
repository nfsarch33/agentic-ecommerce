openapi: 3.1.0
info:
  title: Agentic Ecommerce Mission Control API
  version: 0.1.0
  description: |
    Public contract for the Agentic Ecommerce Go backend consumed by
    agentic-ecommerce-web. This spec intentionally excludes private
    operator endpoints and credential-bearing surfaces.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /healthz:
    get:
      summary: Health check
      operationId: getHealthz
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/v1/products:
    get:
      summary: List storefront products
      operationId: listProducts
      security:
        - bearerAuth: []
        - {}
      responses:
        '200':
          description: Product list
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
              description: Present when the request origin matches ECOMMERCE_ALLOWED_ORIGIN.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
        '401':
          description: Missing or invalid bearer token when ECOMMERCE_API_TOKEN is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Origin rejected by CORS policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    options:
      summary: Products CORS preflight
      operationId: productsPreflight
      responses:
        '204':
          description: Preflight accepted.
        '403':
          description: Origin rejected by CORS policy.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  schemas:
    HealthResponse:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: agentic-ecommerce-mc-api
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 0
          description: Amount in the smallest currency unit (for example, cents).
        currency:
          type: string
          enum: [AUD, USD, GBP, EUR]
    Product:
      type: object
      required: [id, title, slug, price, stock]
      properties:
        id:
          type: string
          pattern: '^p_[a-z0-9-]+$'
        title:
          type: string
          minLength: 1
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
        description:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
