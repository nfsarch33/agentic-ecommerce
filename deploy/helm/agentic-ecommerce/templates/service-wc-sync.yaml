apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentic-ecommerce.fullname" . }}-wc-sync
  labels:
    {{- include "agentic-ecommerce.labels" . | nindent 4 }}
    app.kubernetes.io/component: wc-sync
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "agentic-ecommerce.selectorLabels" (dict "name" "wc-sync" "release" .Release.Name) | nindent 4 }}
