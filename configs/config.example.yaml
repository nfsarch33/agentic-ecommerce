http_addr: 127.0.0.1:8080
woocommerce:
  base_url: https://example.invalid
  consumer_key_ref: op://vault/woocommerce/consumer_key
  consumer_secret_ref: op://vault/woocommerce/consumer_secret
llm_router:
  base_url: http://127.0.0.1:8081
media:
  storage_driver: filesystem
  store: filesystem
  base_path: .local/media-uploads
  root: .local/media-uploads
  bucket: ""
  public_base_url: /media
  max_size_bytes: 5242880
  allowed_mime_types:
    - image/jpeg
    - image/png
    - image/webp
compliance:
  min_seo_score: 70
  max_image_size_bytes: 5242880
  allowed_mime_types:
    - image/jpeg
    - image/png
    - image/webp
